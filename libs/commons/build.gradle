plugins {
    id 'java'
    id 'jacoco'
}

group = 'net.trackme.backend'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'jakarta.persistence:jakarta.persistence-api:3.1.0'
    implementation 'jakarta.validation:jakarta.validation-api:3.1.0'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.15.4'
    implementation 'org.projectlombok:lombok:1.18.28'
    implementation 'org.springframework:spring-core:6.2.2'
    implementation 'org.springframework.security:spring-security-core:6.4.4'

    implementation 'org.projectlombok:lombok:1.18.34'

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'

    annotationProcessor 'org.projectlombok:lombok:1.18.34'

}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}