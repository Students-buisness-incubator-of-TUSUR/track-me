name: Build and Push Docker Images

permissions:
  contents: read
  packages: write
  id-token: write
  pull-requests: write
  security-events: write

on:
  push:
    branches: [ develop, master ]
    tags: [ 'v*.*.*' ]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'docs/**'

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      gateway: ${{ steps.filter.outputs.gateway }}
      sso: ${{ steps.filter.outputs.sso }}
      frontend: ${{ steps.filter.outputs.frontend }}
      meeting-service: ${{ steps.filter.outputs.meeting-service }}
    steps:
      - uses: actions/checkout@v4
      - name: Filter changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'apps/backend/**'
            gateway:
              - 'apps/trackme-gateway/**'
            sso:
              - 'services/trackme-sso/**'
            frontend:
              - 'apps/frontend/**'
            meeting-service:
              - 'services/meeting-service/**'

  trackme-backend-build-push:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
            ghcr.io/${{ github.repository }}/backend:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trackme-client-build-push:
    needs: changes
    if: needs.changes.outputs.gateway == 'true' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
      - name: Build and Push trackme-client Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/trackme-gateway/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/gateway:latest
            ghcr.io/${{ github.repository }}/gateway:${{ github.sha }}
            ghcr.io/${{ github.repository }}/gateway:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trackme-sso-build-push:
    needs: changes
    if: needs.changes.outputs.sso == 'true' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
      - name: Build and Push trackme-sso Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/trackme-sso/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/sso:latest
            ghcr.io/${{ github.repository }}/sso:${{ github.sha }}
            ghcr.io/${{ github.repository }}/sso:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trackme-frontend-build-push:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
      - name: Build and Push trackme-frontend Image
        uses: docker/build-push-action@v5
        with:
          context: apps/frontend
          push: true
          secret-envs: |
            NODE_ENV=development
            REACT_APP_ENV=stage
          tags: |
            ghcr.io/${{ github.repository }}/frontend:latest
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
            ghcr.io/${{ github.repository }}/frontend:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  trackme-meeting-service-build-push:
    needs: changes
    if: needs.changes.outputs.meeting-service == 'true' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
      - name: Build and Push trackme-meeting-service Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/meeting-service/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/meeting-service:latest
            ghcr.io/${{ github.repository }}/meeting-service:${{ github.sha }}
            ghcr.io/${{ github.repository }}/meeting-service:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

