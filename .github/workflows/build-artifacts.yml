name: Build and Push Docker Images

permissions:
  contents: read
  packages: write
  id-token: write
  pull-requests: write
  security-events: write

on:
  push:
    branches: [ develop, master ]
    tags: [ 'v*.*.*' ]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'docs/**'

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      gateway: ${{ steps.filter.outputs.gateway }}
      sso: ${{ steps.filter.outputs.sso }}
      meeting-service: ${{ steps.filter.outputs.meeting-service }}
      telegram-service: ${{ steps.filter.outputs.telegram-service }}
    steps:
      - uses: actions/checkout@v4
      - name: Filter changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'apps/backend/**'
              - 'build.gradle'
              - 'gradle.properties'
            gateway:
              - 'apps/trackme-gateway/**'
              - 'build.gradle'
              - 'gradle.properties'
            sso:
              - 'services/trackme-sso/**'
              - 'build.gradle'
              - 'gradle.properties'
            meeting-service:
              - 'services/meeting-service/**'
              - 'build.gradle'
              - 'gradle.properties'
            telegram-service:
              - 'services/telegram-service/**'
              - 'build.gradle'
              - 'gradle.properties'

  trackme-backend-build-push:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image repository name
        run: echo "IMAGE_REPO=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          secrets: |
            gpr_token=${{ secrets.GITHUB_TOKEN }}
          tags: |
            ghcr.io/${{ env.IMAGE_REPO }}/backend:latest
            ghcr.io/${{ env.IMAGE_REPO }}/backend:${{ github.sha }}
            ghcr.io/${{ env.IMAGE_REPO }}/backend:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trackme-client-build-push:
    needs: changes
    if: needs.changes.outputs.gateway == 'true' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase image repository name
        run: echo "IMAGE_REPO=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
      - name: Build and Push trackme-client Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/trackme-gateway/Dockerfile
          push: true
          secrets: |
            gpr_token=${{ secrets.GITHUB_TOKEN }}
          tags: |
            ghcr.io/${{ env.IMAGE_REPO }}/gateway:latest
            ghcr.io/${{ env.IMAGE_REPO }}/gateway:${{ github.sha }}
            ghcr.io/${{ env.IMAGE_REPO }}/gateway:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trackme-sso-build-push:
    needs: changes
    if: needs.changes.outputs.sso == 'true' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase image repository name
        run: echo "IMAGE_REPO=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
      - name: Build and Push trackme-sso Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/trackme-sso/Dockerfile
          push: true
          secrets: |
            gpr_token=${{ secrets.GITHUB_TOKEN }}
          tags: |
            ghcr.io/${{ env.IMAGE_REPO }}/sso:latest
            ghcr.io/${{ env.IMAGE_REPO }}/sso:${{ github.sha }}
            ghcr.io/${{ env.IMAGE_REPO }}/sso:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trackme-meeting-service-build-push:
    needs: changes
    if: needs.changes.outputs.meeting-service == 'true' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase image repository name
        run: echo "IMAGE_REPO=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
      - name: Build and Push trackme-meeting-service Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/meeting-service/Dockerfile
          push: true
          secrets: |
            gpr_token=${{ secrets.GITHUB_TOKEN }}
          tags: |
            ghcr.io/${{ env.IMAGE_REPO }}/meeting-service:latest
            ghcr.io/${{ env.IMAGE_REPO }}/meeting-service:${{ github.sha }}
            ghcr.io/${{ env.IMAGE_REPO }}/meeting-service:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trackme-telegram-service-build-push:
    needs: changes
    if: needs.changes.outputs.telegram-service == 'true' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase image repository name
        run: echo "IMAGE_REPO=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
      - name: Build and Push trackme-telegram-service Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/telegram-service/Dockerfile
          push: true
          secrets: |
            gpr_token=${{ secrets.GITHUB_TOKEN }}
          tags: |
            ghcr.io/${{ env.IMAGE_REPO }}/telegram-service:latest
            ghcr.io/${{ env.IMAGE_REPO }}/telegram-service:${{ github.sha }}
            ghcr.io/${{ env.IMAGE_REPO }}/telegram-service:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trackme-build-and-push-summary:
    needs:
      - trackme-backend-build-push
      - trackme-client-build-push
      - trackme-sso-build-push
      - trackme-meeting-service-build-push
      - trackme-telegram-service-build-push
    runs-on: ubuntu-latest
    steps:
      - name: Build Summary
        run: |
          echo "## Build Summary"
          if [ "${{ needs.changes.outputs.backend }}" = "true" ] || [ "${{ github.ref_type }}" = "tag" ]; then
            echo "- Backend image built and pushed."
          else
            echo "- Backend image not changed."
          fi
          if [ "${{ needs.changes.outputs.gateway }}" = "true" ] || [ "${{ github.ref_type }}" = "tag" ]; then
            echo "- Gateway image built and pushed."
          else
            echo "- Gateway image not changed."
          fi
          if [ "${{ needs.changes.outputs.sso }}" = "true" ] || [ "${{ github.ref_type }}" = "tag" ]; then
            echo "- SSO image built and pushed."
          else
            echo "- SSO image not changed."
          fi
          if [ "${{ needs.changes.outputs.meeting-service }}" = "true" ] || [ "${{ github.ref_type }}" = "tag" ]; then
            echo "- Meeting Service image built and pushed."
          else
            echo "- Meeting Service image not changed."
          fi
          if [ "${{ needs.changes.outputs.telegram-service }}" = "true" ] || [ "${{ github.ref_type }}" = "tag" ]; then
            echo "- Telegram Service image built and pushed."
          else
            echo "- Telegram Service image not changed."
          fi

