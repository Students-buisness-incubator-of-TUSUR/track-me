name: deploy.yml
on:
  push:
    branches:
      - develop
      - main
    tags:
      - v*
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Build backend
        run: ./gradlew :apps:backend:build

      - name: Build backend Docker image
        run: docker build -t track-me-backend:${{ github.ref_name }} ./apps/backend

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Docker push
        run: |
            docker tag track-me-backend:${{ github.ref_name }} ${{ secrets.DOCKER_USERNAME }}/track-me-backend:latest
            docker push ${{ secrets.DOCKER_USERNAME }}/track-me-backend:latest

      - name: Copy Docker Compose file to server
        run: scp docker-compose.yml ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/home/vmv94/gpo/track-me


      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            cd /home/vmv94/gpo/track-me
            docker compose down
            docker compose pull
            docker compose up -d
          
