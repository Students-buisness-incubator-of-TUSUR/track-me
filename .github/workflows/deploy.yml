name: deploy.yml
on:
  push:
    tags:
      - 'v*'
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Build backend
        run: ./gradlew :apps:backend:build

      - name: Build backend Docker image
        run: docker build -t track-me-backend:${{ github.ref_name }} ./apps/backend

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Save Docker image
        run: docker save -o track-me-backend.tar track-me-backend:${{ github.ref_name }}

      - name: Copy Docker image to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: track-me-backend.tar
          target: /home/vmv94/gpo/track-me

      - name: Deploy backend
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            docker load -i /home/vmv94/gpo/track-me/track-me-backend.tar
            docker stop track-me-backend || true
            docker rm track-me-backend || true
            docker run -d --name track-me-backend -p 8080:8080 track-me-backend:${{ github.ref_name }}