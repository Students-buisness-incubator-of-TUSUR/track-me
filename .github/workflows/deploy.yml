name: deploy.yml
on:
  push:
    branches:
      - develop
      - main
    tags:
      - v*
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Build backend
        run: ./gradlew :apps:backend:build

      - name: Build backend Docker image
        run: docker build -t track-me-backend:${{ github.ref_name }} ./apps/backend

      - name: Save Docker image
        run: docker save track-me-backend:${{ github.ref_name }} -o track-me-backend.tar

      - name: Fix permissions
        run: chmod 644 track-me-backend.tar

      - name: Check if file exists
        run: |
          ls -la
          if [ -f "track-me-backend.tar" ]; then
            echo "File exists"
          else
            echo "File does not exist"
            exit 1
          fi

      - name: Copy Docker image to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: track-me-backend.tar
          target: /home/vmv94/gpo/track-me

      - name: Deploy backend
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /home/vmv94/gpo/track-me
            docker load -i track-me-backend.tar
            docker tag track-me-backend:${{ github.ref_name }} track-me-backend:latest
            docker compose down
            docker compose up -d