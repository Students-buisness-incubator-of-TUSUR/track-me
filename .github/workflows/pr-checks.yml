name: PR Checks

permissions:
  contents: read
  packages: write
  id-token: write
  pull-requests: write
  security-events: write

on:
  pull_request:
    branches: [ develop ]

jobs:
  backend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties', '**/build.gradle') }}
      - name: Build and Test Backend
        run: |
          ./gradlew build jacocoTestReport

  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
        working-directory: apps/frontend
      - name: Build frontend
        run: npm run build
        working-directory: apps/frontend
      - name: Test frontend
        run: npm run test
        working-directory: apps/frontend

  sonar-checks:
    needs: [ backend-check, frontend-check ]
    runs-on: ubuntu-latest
    steps:
      - name: Analyze with SonarCloud

        uses: SonarSource/sonarcloud-github-action@4006f663ecaf1f8093e8e4abb9227f6041f52216
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}   # Generate a token on Sonarcloud.io, add it to the secrets of this repo with the name SONAR_TOKEN (Settings > Secrets > Actions > add new repository secret)
        with:
          args:
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }} # mandatory, default is the name of the project
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }} # mandatory, default is the name of the organization
          projectBaseDir: .
