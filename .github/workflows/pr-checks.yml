name: PR Checks

permissions:
  contents: read
  pull-requests: write
  packages: read

on:
  push:
    branches: [ develop ]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'docs/**'
  pull_request:
    branches: [ develop ]
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: pr-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: backend
            path: apps/backend
          - module: trackme-gateway
            path: apps/trackme-gateway
          - module: trackme-sso
            path: services/trackme-sso
          - module: meeting-service
            path: services/meeting-service
          - module: telegram-service
            path: services/telegram-service
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Check ${{ matrix.module }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :${{ matrix.module }}:check
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-${{ matrix.module }}
          path: ${{ matrix.path }}/build/reports/jacoco/test/jacocoTestReport.xml
          if-no-files-found: error
          retention-days: 1

  sonar:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Полная история нужна SonarCloud для анализа нового кода и blame
          fetch-depth: 0
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: jacoco-backend
          path: apps/backend/build/reports/jacoco/test
      - name: Download gateway coverage
        uses: actions/download-artifact@v4
        with:
          name: jacoco-trackme-gateway
          path: apps/trackme-gateway/build/reports/jacoco/test
      - name: Download sso coverage
        uses: actions/download-artifact@v4
        with:
          name: jacoco-trackme-sso
          path: services/trackme-sso/build/reports/jacoco/test
      - name: Download meeting-service coverage
        uses: actions/download-artifact@v4
        with:
          name: jacoco-meeting-service
          path: services/meeting-service/build/reports/jacoco/test
      - name: Download telegram-service coverage
        uses: actions/download-artifact@v4
        with:
          name: jacoco-telegram-service
          path: services/telegram-service/build/reports/jacoco/test
      - name: SonarCloud analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          ./gradlew sonar
          -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
          -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
          -Dsonar.token=${{ secrets.SONAR_TOKEN }}
          ${{ github.event_name == 'pull_request' && format('-Dsonar.pullrequest.key={0} -Dsonar.pullrequest.branch={1} -Dsonar.pullrequest.base={2}', github.event.pull_request.number, github.head_ref, github.base_ref) || '' }}

  all-checks:
    needs: [ check, sonar ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify results
        run: |
          check_result="${{ needs.check.result }}"
          sonar_result="${{ needs.sonar.result }}"
          echo "check: $check_result, sonar: $sonar_result"
          if [[ "$check_result" != "success" || "$sonar_result" != "success" ]]; then
            echo "❌ Проверки не прошли"
            exit 1
          fi
          echo "✅ Все проверки пройдены"
