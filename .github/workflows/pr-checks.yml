name: PR Checks

permissions:
  contents: read
  packages: read

on:
  push:
    branches: [ develop ]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'docs/**'
  pull_request:
    branches: [ develop ]
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: pr-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: backend
            path: apps/backend
          - module: trackme-gateway
            path: apps/trackme-gateway
          - module: trackme-sso
            path: services/trackme-sso
          - module: meeting-service
            path: services/meeting-service
          - module: telegram-service
            path: services/telegram-service
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle
      - name: Check ${{ matrix.module }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :${{ matrix.module }}:check
      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jacoco-${{ matrix.module }}
          path: ${{ matrix.path }}/build/reports/jacoco/test/jacocoTestReport.xml
          if-no-files-found: error
          retention-days: 1

  sonar:
    permissions:
      contents: read
      packages: read
      pull-requests: write
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Полная история нужна SonarCloud для анализа нового кода и blame
          fetch-depth: 0
      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle
      - name: Download backend coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: jacoco-backend
          path: apps/backend/build/reports/jacoco/test
      - name: Download gateway coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: jacoco-trackme-gateway
          path: apps/trackme-gateway/build/reports/jacoco/test
      - name: Download sso coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: jacoco-trackme-sso
          path: services/trackme-sso/build/reports/jacoco/test
      - name: Download meeting-service coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: jacoco-meeting-service
          path: services/meeting-service/build/reports/jacoco/test
      - name: Download telegram-service coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: jacoco-telegram-service
          path: services/telegram-service/build/reports/jacoco/test
      - name: Compile sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew testClasses
      - name: SonarCloud analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_BASE_REF: ${{ github.base_ref }}
        run: |
          args=(
            "-Dsonar.projectKey=$SONAR_PROJECT_KEY"
            "-Dsonar.organization=$SONAR_ORGANIZATION"
            "-Dsonar.token=$SONAR_TOKEN"
          )
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            args+=(
              "-Dsonar.pullrequest.key=$PR_NUMBER"
              "-Dsonar.pullrequest.branch=$PR_HEAD_REF"
              "-Dsonar.pullrequest.base=$PR_BASE_REF"
            )
          fi
          ./gradlew sonar "${args[@]}"

  all-checks:
    needs: [ check, sonar ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify results
        run: |
          check_result="${{ needs.check.result }}"
          sonar_result="${{ needs.sonar.result }}"
          echo "check: $check_result, sonar: $sonar_result"
          if [[ "$check_result" != "success" || "$sonar_result" != "success" ]]; then
            echo "❌ Проверки не прошли"
            exit 1
          fi
          echo "✅ Все проверки пройдены"
