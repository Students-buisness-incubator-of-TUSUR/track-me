name: PR Checks

permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches: [ develop ]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'docs/**'
  pull_request:
    branches: [ develop ]
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: pr-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
      meeting-service: ${{ steps.changes.outputs.meeting-service }}
      sso: ${{ steps.changes.outputs.sso }}
      gateway: ${{ steps.changes.outputs.gateway }}
      commons: ${{ steps.changes.outputs.commons }}
      telegram-service: ${{ steps.changes.outputs.telegram-service }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            backend:
              - 'apps/backend/**'
              - 'libs/commons/**'
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle/**'
            frontend:
              - 'apps/frontend/**'
            meeting-service:
              - 'services/meeting-service/**'
              - 'libs/commons/**'
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle/**'
            sso:
              - 'services/trackme-sso/**'
              - 'libs/commons/**'
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle/**'
            gateway:
              - 'apps/trackme-gateway/**'
              - 'libs/commons/**'
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle/**'
            commons:
              - 'libs/commons/**'
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle/**'
            telegram-service:
              - 'services/telegram-service/**'
              - 'libs/commons/**'
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle/**'

  backend-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Cache Gradle Wrapper
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/
          key: ${{ runner.os }}-gradle
          restore-keys: |
            ${{ runner.os }}-gradle
      - name: Cache SonarQube
        uses: actions/cache@v3
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: |
            ${{ runner.os }}-sonar
      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          pwd; ls -l .
          ./gradlew :backend:check :backend:sonar \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.pullrequest.key=${{ github.event.pull_request.number }} \
            -Dsonar.pullrequest.branch=${{ github.head_ref }} \
            -Dsonar.pullrequest.base=${{ github.base_ref }} \

  frontend-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: detect-changes
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Cache Node modules
        uses: actions/cache@v3
        with:
          path: |
            apps/frontend/node_modules
            apps/frontend/package-lock.json
          key: ${{ runner.os }}-node-${{ hashFiles('apps/frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node
      - name: Install dependencies
        run: npm install
        working-directory: apps/frontend
      - name: Install sonar-scanner
        run: npm install -g sonar-scanner
      - name: Run tests and generate coverage
        run: npm run test:coverage
        working-directory: apps/frontend
      - name: Run sonar-scanner
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          sonar-scanner \
            -Dsonar.projectKey=${{ secrets.SONAR_FRONTEND_PROJECT_KEY }} \
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }} \
            -Dsonar.sources=src \
            -Dsonar.exclusions="src/**/*.test.js,src/**/*.spec.js,src/**/__tests__/**" \
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.pullrequest.key=${{ github.event.pull_request.number }} \
            -Dsonar.pullrequest.branch=${{ github.head_ref }} \
            -Dsonar.pullrequest.base=${{ github.base_ref }}
        working-directory: apps/frontend

  meeting-service-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: detect-changes
    if: needs.detect-changes.outputs.meeting-service == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Cache Gradle Wrapper
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/
          key: ${{ runner.os }}-gradle
          restore-keys: |
            ${{ runner.os }}-gradle
      - name: Cache SonarQube
        uses: actions/cache@v3
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: |
            ${{ runner.os }}-sonar
      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          pwd; ls -l .
          ./gradlew :meeting-service:check :meeting-service:sonar \
            -Dsonar.projectKey=trackme-meeting-service \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.pullrequest.key=${{ github.event.pull_request.number }} \
            -Dsonar.pullrequest.branch=${{ github.head_ref }} \
            -Dsonar.pullrequest.base=${{ github.base_ref }} \

  sso-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: detect-changes
    if: needs.detect-changes.outputs.sso == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Cache Gradle Wrapper
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/
          key: ${{ runner.os }}-gradle
          restore-keys: |
            ${{ runner.os }}-gradle
      - name: Cache SonarQube
        uses: actions/cache@v3
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: |
            ${{ runner.os }}-sonar
      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          pwd; ls -l .
          ./gradlew :trackme-sso:check :trackme-sso:sonar \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.pullrequest.key=${{ github.event.pull_request.number }} \
            -Dsonar.pullrequest.branch=${{ github.head_ref }} \
            -Dsonar.pullrequest.base=${{ github.base_ref }} \

  gateway-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: detect-changes
    if: needs.detect-changes.outputs.gateway == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Cache Gradle Wrapper
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/
          key: ${{ runner.os }}-gradle
          restore-keys: |
            ${{ runner.os }}-gradle
      - name: Cache SonarQube
        uses: actions/cache@v3
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: |
            ${{ runner.os }}-sonar
      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          pwd; ls -l .
          ./gradlew :trackme-gateway:check :trackme-gateway:sonar \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.pullrequest.key=${{ github.event.pull_request.number }} \
            -Dsonar.pullrequest.branch=${{ github.head_ref }} \
            -Dsonar.pullrequest.base=${{ github.base_ref }} \

  libs-commons-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: detect-changes
    if: needs.detect-changes.outputs.commons == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Cache Gradle Wrapper
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/
          key: ${{ runner.os }}-gradle
          restore-keys: |
            ${{ runner.os }}-gradle
      - name: Cache SonarQube
        uses: actions/cache@v3
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: |
            ${{ runner.os }}-sonar
      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          pwd; ls -l .
          ./gradlew :commons:check :commons:sonar \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.pullrequest.key=${{ github.event.pull_request.number }} \
            -Dsonar.pullrequest.branch=${{ github.head_ref }} \
            -Dsonar.pullrequest.base=${{ github.base_ref }} \

  telegram-service-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: detect-changes
    if: needs.detect-changes.outputs.telegram-service == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Cache Gradle Wrapper
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/
          key: ${{ runner.os }}-gradle
          restore-keys: |
            ${{ runner.os }}-gradle
      - name: Cache SonarQube
        uses: actions/cache@v3
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: |
            ${{ runner.os }}-sonar
      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          pwd; ls -l .
          ./gradlew :telegram-service:check :telegram-service:sonar \
            -Dsonar.projectKey=track-me-telegram-service \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.pullrequest.key=${{ github.event.pull_request.number }} \
            -Dsonar.pullrequest.branch=${{ github.head_ref }} \
            -Dsonar.pullrequest.base=${{ github.base_ref }} \

  trackme-check:
    runs-on: ubuntu-latest
    needs: [ detect-changes, backend-check, frontend-check, meeting-service-check, sso-check, gateway-check, libs-commons-check, telegram-service-check ]
    if: ${{ always() && needs.detect-changes.result == 'success' }}
    steps:
      - name: Final check
        run: |
          echo "Checking results of all completed jobs..."
          
          # Check if any job was required and failed
          backend_needed="${{ needs.detect-changes.outputs.backend }}"
          meeting_service_needed="${{ needs.detect-changes.outputs.meeting-service }}"
          sso_needed="${{ needs.detect-changes.outputs.sso }}"
          gateway_needed="${{ needs.detect-changes.outputs.gateway }}"
          
          backend_result="${{ needs.backend-check.result }}"
          meeting_service_result="${{ needs.meeting-service-check.result }}"
          sso_result="${{ needs.sso-check.result }}"
          gateway_result="${{ needs.gateway-check.result }}"
          telegram_service_result="${{ needs.telegram-service-check.result }}"
          
          failed_jobs=""
          
          if [[ "$backend_needed" == "true" && "$backend_result" == "failure" ]]; then
            failed_jobs="$failed_jobs backend-check"
          fi
          
          if [[ "$meeting_service_needed" == "true" && "$meeting_service_result" == "failure" ]]; then
            failed_jobs="$failed_jobs meeting-service-check"
          fi
          
          if [[ "$sso_needed" == "true" && "$sso_result" == "failure" ]]; then
            failed_jobs="$failed_jobs sso-check"
          fi
          
          if [[ "$gateway_needed" == "true" && "$gateway_result" == "failure" ]]; then
            failed_jobs="$failed_jobs gateway-check"
          fi
          
            if [[ "$telegram_service_result" == "failure" ]]; then
                failed_jobs="$failed_jobs telegram-service-check"
            fi
          
          if [[ -n "$failed_jobs" ]]; then
            echo "❌ The following required checks failed:$failed_jobs"
            exit 1
          else
            echo "✅ All required checks completed successfully!"
          fi
