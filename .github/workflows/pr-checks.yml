name: PR Checks

permissions:
  contents: read
  pull-requests: write
  packages: read

on:
  push:
    branches: [ develop ]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'docs/**'
  pull_request:
    branches: [ develop ]
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: pr-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        module:
          - backend
          - trackme-gateway
          - trackme-sso
          - meeting-service
          - telegram-service
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Check ${{ matrix.module }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :${{ matrix.module }}:check

  sonar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Полная история нужна SonarCloud для анализа нового кода и blame
          fetch-depth: 0
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Build and test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew build
      - name: SonarCloud analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          ./gradlew sonar
          -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
          -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
          -Dsonar.token=${{ secrets.SONAR_TOKEN }}
          ${{ github.event_name == 'pull_request' && format('-Dsonar.pullrequest.key={0} -Dsonar.pullrequest.branch={1} -Dsonar.pullrequest.base={2}', github.event.pull_request.number, github.head_ref, github.base_ref) || '' }}

  all-checks:
    needs: [ check, sonar ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify results
        run: |
          check_result="${{ needs.check.result }}"
          sonar_result="${{ needs.sonar.result }}"
          echo "check: $check_result, sonar: $sonar_result"
          if [[ "$check_result" != "success" || "$sonar_result" != "success" ]]; then
            echo "❌ Проверки не прошли"
            exit 1
          fi
          echo "✅ Все проверки пройдены"