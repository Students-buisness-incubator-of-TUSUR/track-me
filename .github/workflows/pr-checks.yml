name: PR Checks

permissions:
  contents: read
  packages: write
  id-token: write
  pull-requests: write
  security-events: write

on:
  push:
    branches: [ develop ]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'docs/**'
  pull_request:
    branches: [ develop ]
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: pr-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  trackme-backend-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # Best practice: enable full clone for Sonar analysis
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-backend-${{ hashFiles('backend/gradle/wrapper/gradle-wrapper.properties', 'backend/build.gradle*') }}
      - name: Build, Test & Jacoco Backend
        run: ./gradlew :backend:clean :backend:build :backend:jacocoTestReport
      - name: Upload Backend Jacoco Report
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco
          path: apps/backend/build/reports/jacoco/test/jacocoTestReport.xml

  trackme-frontend-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: apps/frontend
      - name: Lint frontend
        run: npm run lint --if-present
        working-directory: apps/frontend
      - name: Build frontend
        run: npm run build
        working-directory: apps/frontend
      - name: Test frontend
        run: npm run test -- --ci --coverage --reporters=default
        working-directory: apps/frontend
      - name: Upload frontend coverage
        if: success() && hashFiles('apps/frontend/coverage/lcov.info') != ''
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: apps/frontend/coverage/lcov.info

  trackme-gateway-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-gateway-${{ hashFiles('trackme-gateway/gradle/wrapper/gradle-wrapper.properties', 'trackme-gateway/build.gradle*') }}
      - name: Build, Test & Jacoco Gateway
        run: ./gradlew :trackme-gateway:clean :trackme-gateway:build

  trackme-sso-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-sso-${{ hashFiles('trackme-sso/gradle/wrapper/gradle-wrapper.properties', 'trackme-sso/build.gradle*') }}
      - name: Build, Test & Jacoco SSO
        run: ./gradlew :trackme-sso:clean :trackme-sso:build :trackme-sso:jacocoTestReport
      - name: Upload SSO Jacoco Report
        uses: actions/upload-artifact@v4
        with:
          name: sso-jacoco
          path: services/trackme-sso/build/reports/jacoco/test/jacocoTestReport.xml

  sonarqube-check:
    runs-on: ubuntu-latest
    needs:
      - trackme-backend-check
      - trackme-frontend-check
      - trackme-gateway-check
      - trackme-sso-check
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java for SonarQube
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download Backend Jacoco Report
        uses: actions/download-artifact@v4
        with:
          name: backend-jacoco
          path: apps/backend/build/reports/jacoco/test/
      - name: Download SSO Jacoco Report
        uses: actions/download-artifact@v4
        with:
          name: sso-jacoco
          path: services/trackme-sso/build/reports/jacoco/test/
      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: apps/frontend/coverage/

      - name: SonarCloud scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./gradlew sonar \
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }} \
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }} \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.pullrequest.key=${{ github.event.pull_request.number }} \
            -Dsonar.pullrequest.branch=${{ github.head_ref }} \
            -Dsonar.pullrequest.base=${{ github.base_ref }} \
            -Dsonar.coverage.jacoco.xmlReportPaths=apps/backend/build/reports/jacoco/test/jacocoTestReport.xml,services/trackme-sso/build/reports/jacoco/test/jacocoTestReport.xml \
            -Dsonar.javascript.lcov.reportPaths=apps/frontend/coverage/lcov.info
