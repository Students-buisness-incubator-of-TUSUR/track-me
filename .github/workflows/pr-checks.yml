name: PR Checks

permissions:
  contents: read
  packages: write
  id-token: write
  pull-requests: write
  security-events: write

on:
  pull_request:
    branches: [ develop ]

jobs:
  backend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties', '**/build.gradle') }}
      - name: Build and Test Backend
        with:
          args:
            -PjacocoReportDir=build/reports/jacoco/test
            -Psonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Psonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Psonar.host.url=https://sonarcloud.io
            -Psonar.login=${{ secrets.SONAR_TOKEN }}
        run: |
          ./gradlew build jacocoTestReport sonar

  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
        working-directory: apps/frontend
      - name: Build frontend
        run: npm run build
        working-directory: apps/frontend
      - name: Test frontend
        run: npm run test
        working-directory: apps/frontend
