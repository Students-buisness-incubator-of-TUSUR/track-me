name: check-changes.yml
on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]
jobs:
  check-changes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          base_sha: ${{ github.pull_request.base.sha }}

      - name: Check if backend files changed
        id: backend-changed
        run: |
          changed=$(echo "${{ steps.changed-files.outputs.all_changed_files }}" | tr ' ' '\n' | grep -q '^apps/backend/' && echo true || echo false)
          echo "::set-output name=changed::$changed"

      - name: Run backend tests
        if: steps.backend-changed.outputs.changed == 'true'
        run: ./gradlew :apps:backend:test