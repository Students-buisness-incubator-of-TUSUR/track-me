name: Deploy to DEV

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag to deploy'
        required: true
        default: 'latest'
        type: string
  workflow_run:
    workflows: [ "Build and Push Docker Images" ]
    types: [ completed ]
    branches: [ develop ]

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: dev
    steps:
      - name: Resolve image reference
        id: image
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.image_tag }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            TAG="$INPUT_TAG"
          else
            # Деплоим ровно тот коммит, образы которого собрал CI
            TAG="$HEAD_SHA"
          fi
          echo "repo=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Deploy to DEV
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_REPO: ${{ steps.image.outputs.repo }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YANDEX_CLIENT_ID: ${{ secrets.YANDEX_CLIENT_ID }}
          YANDEX_CLIENT_SECRET: ${{ secrets.YANDEX_CLIENT_SECRET }}
        with:
          host: ${{ secrets.SBI_SSH_HOST }}
          username: ${{ secrets.SBI_SSH_USERNAME }}
          key: ${{ secrets.SBI_SSH_PRIVATE_KEY }}
          proxy_host: bastion.tusur.ru
          proxy_username: ${{ secrets.SBI_SSH_USERNAME }}
          proxy_key: ${{ secrets.SBI_SSH_PRIVATE_KEY }}
          envs: IMAGE_REPO,IMAGE_TAG,GHCR_USER,GHCR_TOKEN,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,YANDEX_CLIENT_ID,YANDEX_CLIENT_SECRET
          script: |
            set -euo pipefail
            cd "$HOME/track-me-dev"

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            touch .env
            chmod 600 .env

            set_env_var() {
              key="$1"
              value="$2"
              if [ -z "$value" ]; then
                echo "::warning::$key не задан в секретах GitHub — прежнее значение в .env сохранено"
                return 0
              fi
              grep -v "^${key}=" .env > .env.tmp || true
              cp .env.tmp .env   # cp, а не mv: сохраняем права на .env
              rm -f .env.tmp
              printf '%s=%s\n' "$key" "$value" >> .env
            }

            set_env_var IMAGE_REPO "$IMAGE_REPO"
            set_env_var IMAGE_TAG "$IMAGE_TAG"

            set_env_var GOOGLE_CLIENT_ID "${GOOGLE_CLIENT_ID:-}"
            set_env_var GOOGLE_CLIENT_SECRET "${GOOGLE_CLIENT_SECRET:-}"
            set_env_var YANDEX_CLIENT_ID "${YANDEX_CLIENT_ID:-}"
            set_env_var YANDEX_CLIENT_SECRET "${YANDEX_CLIENT_SECRET:-}"

            docker compose pull
            docker compose up -d
            docker image prune -f

      - name: Healthcheck
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SBI_SSH_HOST }}
          username: ${{ secrets.SBI_SSH_USERNAME }}
          key: ${{ secrets.SBI_SSH_PRIVATE_KEY }}
          proxy_host: bastion.tusur.ru
          proxy_username: ${{ secrets.SBI_SSH_USERNAME }}
          proxy_key: ${{ secrets.SBI_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd "$HOME/track-me-dev"
            check() {
              for i in $(seq 1 24); do
                if curl -sf "$2" > /dev/null; then
                  echo "$1 is up"
                  return 0
                fi
                echo "Waiting for $1... ($i/24)"
                sleep 5
              done
              echo "$1 failed healthcheck" >&2
              docker compose logs --tail=50 "$3" >&2 || true
              return 1
            }
            check backend http://localhost:8080/actuator/health trackme-backend
            check sso http://localhost:9000/actuator/health trackme-sso
            check gateway http://localhost:8081/actuator/health trackme-client-gateway
