name: Deploy to PROD

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Релизный тег vX.Y.Z для выкатки/отката'
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image reference
        id: image
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            TAG="$INPUT_TAG"
          else
            TAG="$RELEASE_TAG"
          fi
          # На prod выкатываем только неизменяемые релизные теги vX.Y.Z
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "Ожидался релизный тег вида vX.Y.Z, получено: '$TAG'" >&2
            exit 1
          fi
          echo "repo=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Copy deployment files to PROD
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SBI_SSH_HOST }}
          username: ${{ secrets.SBI_SSH_USERNAME }}
          key: ${{ secrets.SBI_SSH_PRIVATE_KEY }}
          proxy_host: bastion.tusur.ru
          proxy_username: ${{ secrets.SBI_SSH_USERNAME }}
          proxy_key: ${{ secrets.SBI_SSH_PRIVATE_KEY }}
          source: "docker/docker-compose.prod.yaml,database/init_schemas.sql"
          target: track-me-prod
          overwrite: true

      - name: Deploy to PROD
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_REPO: ${{ steps.image.outputs.repo }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YANDEX_CLIENT_ID: ${{ secrets.YANDEX_CLIENT_ID }}
          YANDEX_CLIENT_SECRET: ${{ secrets.YANDEX_CLIENT_SECRET }}
        with:
          host: ${{ secrets.SBI_SSH_HOST }}
          username: ${{ secrets.SBI_SSH_USERNAME }}
          key: ${{ secrets.SBI_SSH_PRIVATE_KEY }}
          proxy_host: bastion.tusur.ru
          proxy_username: ${{ secrets.SBI_SSH_USERNAME }}
          proxy_key: ${{ secrets.SBI_SSH_PRIVATE_KEY }}
          envs: IMAGE_REPO,IMAGE_TAG,GHCR_USER,GHCR_TOKEN,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,YANDEX_CLIENT_ID,YANDEX_CLIENT_SECRET
          script: |
            set -euo pipefail
            cd "$HOME/track-me-prod"

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            touch .env
            chmod 600 .env

            # Идемпотентно патчим только ссылки на образы и OAuth-ключи; остальные секреты в .env не трогаем
            set_env_var() {
              key="$1"
              value="$2"
              if [ -z "$value" ]; then
                echo "::warning::$key не задан в секретах GitHub — прежнее значение в .env сохранено"
                return 0
              fi
              grep -v "^${key}=" .env > .env.tmp || true
              cp .env.tmp .env   # cp, а не mv: сохраняем права на .env
              rm -f .env.tmp
              printf '%s=%s\n' "$key" "$value" >> .env
            }

            set_env_var IMAGE_REPO "$IMAGE_REPO"
            set_env_var IMAGE_TAG "$IMAGE_TAG"

            set_env_var GOOGLE_CLIENT_ID "${GOOGLE_CLIENT_ID:-}"
            set_env_var GOOGLE_CLIENT_SECRET "${GOOGLE_CLIENT_SECRET:-}"
            set_env_var YANDEX_CLIENT_ID "${YANDEX_CLIENT_ID:-}"
            set_env_var YANDEX_CLIENT_SECRET "${YANDEX_CLIENT_SECRET:-}"

            # scp сохраняет пути: compose-файл лежит в docker/, а .env и database/ — в корне каталога,
            # поэтому --project-directory . Отдельный проект track-me-prod изолирует prod от dev на том же хосте.
            compose() { docker compose -p track-me-prod --project-directory . -f docker/docker-compose.prod.yaml "$@"; }
            compose pull
            compose up -d --remove-orphans
            docker image prune -f

      - name: Healthcheck
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SBI_SSH_HOST }}
          username: ${{ secrets.SBI_SSH_USERNAME }}
          key: ${{ secrets.SBI_SSH_PRIVATE_KEY }}
          proxy_host: bastion.tusur.ru
          proxy_username: ${{ secrets.SBI_SSH_USERNAME }}
          proxy_key: ${{ secrets.SBI_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd "$HOME/track-me-prod"
            compose() { docker compose -p track-me-prod --project-directory . -f docker/docker-compose.prod.yaml "$@"; }
            # sso/gateway/frontend опубликованы на 127.0.0.1 хоста; backend наружу не торчит — проверяем через exec.
            check() {
              name="$1"; shift
              for i in $(seq 1 24); do
                if "$@" > /dev/null 2>&1; then
                  echo "$name is up"
                  return 0
                fi
                echo "Waiting for $name... ($i/24)"
                sleep 5
              done
              echo "$name failed healthcheck" >&2
              compose logs --tail=50 "$name" >&2 || true
              return 1
            }
            check trackme-sso curl -sf http://127.0.0.1:19000/actuator/health
            check trackme-client-gateway curl -sf http://127.0.0.1:18081/actuator/health
            check trackme-backend compose exec -T trackme-backend curl -sf http://localhost:8080/actuator/health
            check trackme-frontend curl -sf http://127.0.0.1:13000
