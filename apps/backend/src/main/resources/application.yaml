spring:
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          ssl:
            enable: true
  application:
    name: project-place-backend
  data:
    redis:
      client-type: lettuce
      database: 0
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:trackme-redis}
      username: ${REDIS_USER:trackme-redis}
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
  datasource:
    driver-class-name: org.postgresql.Driver
    password: ${DB_PASSWORD:project-place}
    username: ${DB_USERNAME:project-place}
    url: ${DB_URL:jdbc:postgresql://localhost:5432/project-place}
    hikari:
      schema: ${DB_SCHEMA:public}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
        id:
          new_generator_mappings: true
  liquibase:
    default-schema: ${DB_SCHEMA:public}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000
error:
  handling:
    http-status-in-json-response: true
    exception-logging: NO_LOGGING
    full-stacktrace-http-statuses: 5xx
    log-levels:
      5xx: ERROR
springdoc:
  paths-to-match: /api/**
  swagger-ui:
    enabled: false
app:
  name: ${APP_NAME:track-me}
  mail:
    from: ${MAIL_FROM}
  password-reset:
    token-expiration-check-cron: "0 0 0 * * *"
  acl:
    sid-identity-query: "select currval(pg_get_serial_sequence('acl_sid', 'id'))"
    class-identity-query: "select currval(pg_get_serial_sequence('acl_class', 'id'))"
  superadmin:
    email: ${ADMIN_EMAIL:superadmin@superadmin.superadmin}
    username: ${ADMIN_USERNAME:superadmin}
    password: ${ADMIN_PASSWORD:superadmin}
  api-url: ${BACKEND_HOST:http://127.0.0.1:8081/backend}
  app-url: ${FRONTEND_HOST:http://localhost:3000}

#logging:
#  level:
logging:
  level:
    org.springframework.security: trace