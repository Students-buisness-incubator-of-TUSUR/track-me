spring:
  profiles:
    active: development
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          ssl:
            enable: true
  application:
    name: trackme-backend
  data:
    redis:
      client-type: lettuce
      database: 0
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_USER_PASSWORD:trackme-redis-pass}
      username: ${REDIS_USER:trackme-redis}
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
  datasource:
    driver-class-name: org.postgresql.Driver
    password: ${DB_PASSWORD:project-place}
    username: ${DB_USERNAME:project-place}
    url: ${DB_URL:jdbc:postgresql://postgres:5432/project-place}
    hikari:
      schema: ${BACKEND_DB_SCHEMA:backend}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
        id:
          new_generator_mappings: true
  liquibase:
    enabled: true
    default-schema: ${BACKEND_DB_SCHEMA:backend}
    liquibase-schema: ${BACKEND_DB_SCHEMA:backend}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SSO_URI:http://localhost:9000}
error:
  handling:
    http-status-in-json-response: true
    exception-logging: NO_LOGGING
    full-stacktrace-http-statuses: 5xx
    log-levels:
      5xx: ERROR
springdoc:
  paths-to-match: /api/**
  swagger-ui:
    enabled: false
app:
  name: ${APP_NAME:track-me}
  mail:
    from: ${MAIL_FROM}
  acl:
    sid-identity-query: "select currval(pg_get_serial_sequence('acl_sid', 'id'))"
    class-identity-query: "select currval(pg_get_serial_sequence('acl_class', 'id'))"
  api-url: ${BACKEND_URI:http://127.0.0.1:8081}/backend
  app-url: ${FRONTEND_URI:http://127.0.0.1:3000}

---
spring:
  config:
    activate:
      on-profile: docker-local, development
  liquibase:
    contexts: dev prod
logging:
  level:
    org.springframework.security: trace

---
spring:
  config:
    activate:
      on-profile: production
  liquibase:
    contexts: prod

logging:
  level:
    root: info

---
spring:
  config:
    activate:
      on-profile: docker-local
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://host.docker.internal:9000