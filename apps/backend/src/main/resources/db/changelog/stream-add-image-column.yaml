databaseChangeLog:
  - changeSet:
      id: stream-add-image-column-1
      author: akarmanov
      preConditions:
        - onFail: MARK_RAN
          not:
            columnExists:
              tableName: stream
              schemaName: ${db_schema}
              columnName: image
      changes:
        - addColumn:
            schemaName: ${db_schema}
            tableName: stream
            columns:
              - column:
                  name: image
                  type: BLOB
                  constraints:
                    nullable: true