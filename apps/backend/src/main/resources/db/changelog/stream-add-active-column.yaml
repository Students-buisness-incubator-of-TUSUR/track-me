databaseChangeLog:
  - changeSet:
      id: add-stream-active-column-1
      author: akarmanov
      changes:
        - addColumn:
            tableName: stream
            columns:
              - column:
                  name: active
                  type: boolean
                  defaultValue: "false"
                  constraints:
                    nullable: false
      rollback:
        - dropColumn:
            columnName: active
            tableName: stream
  - changeSet:
      id: remove-streams-users-table-1
      author: akarmanov
      changes:
        - dropTable:
            tableName: stream_user