databaseChangeLog:
  - changeSet:
      id: stream-add-description-column-1
      author: akarmanov
      preConditions:
        - onFail: MARK_RAN
          not:
            columnExists:
              schemaName: ${db_schema}
              tableName: stream
              columnName: description
      changes:
        - addColumn:
            schemaName: ${db_schema}
            tableName: stream
            columns:
              - column:
                  name: description
                  type: text
                  constraints:
                    nullable: true