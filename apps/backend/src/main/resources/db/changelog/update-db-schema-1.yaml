databaseChangeLog:
  - changeSet:
      id: update-db-schema-1
      author: Arseniy Karmanov
      preConditions:
        - onFail: MARK_RAN
          or:
            - tableExists:
                tableName: streams
            - not:
                - columnExists:
                    tableName: streams
                    columnName: teams_count
      changes:
        - dropColumn:
            tableName: streams
            columnName: teams_count
  - changeSet:
      id: update-db-schema-2
      author: Arseniy Karmanov
      preConditions:
        - onFail: MARK_RAN
          not:
            - columnExists:
                tableName: streams
                columnName: readiness_level
      changes:
        - addColumn:
            tableName: streams
            columns:
              - column:
                  name: readiness_level
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
  - changeSet:
      id: update-db-schema-3
      author: Arseniy Karmanov
      preConditions:
        - onFail: MARK_RAN
          not:
            - columnExists:
                tableName: streams
                columnName: nti_market
      changes:
        - addColumn:
            tableName: streams
            columns:
              - column:
                  name: nti_market
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
  - changeSet:
      id: update-db-schema-4
      author: Arseniy Karmanov
      preConditions:
        - onFail: MARK_RAN
          not:
            - columnExists:
                tableName: team_cards
                columnName: enabled
      changes:
        - addColumn:
            tableName: team_cards
            columns:
              - column:
                  name: enabled
                  type: boolean
                  constraints:
                    nullable: false
                  defaultValue: true