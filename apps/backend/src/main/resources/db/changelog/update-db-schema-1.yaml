databaseChangeLog:
  - changeSet:
      id: update-db-schema-1
      author: Arseniy Karmanov
      preConditions:
        - onFail: MARK_RAN
          or:
            - tableExists:
                schemaName: ${db_schema}
                tableName: stream
            - not:
                - columnExists:
                    schemaName: ${db_schema}
                    tableName: stream
                    columnName: teams_count
      changes:
        - dropColumn:
            schemaName: ${db_schema}
            tableName: stream
            columnName: teams_count
  - changeSet:
      id: update-db-schema-2
      author: Arseniy Karmanov
      preConditions:
        - onFail: MARK_RAN
          not:
            - columnExists:
                schemaName: ${db_schema}
                tableName: stream
                columnName: readiness_level
      changes:
        - addColumn:
            schemaName: ${db_schema}
            tableName: stream
            columns:
              - column:
                  name: readiness_level
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
  - changeSet:
      id: update-db-schema-3
      author: Arseniy Karmanov
      preConditions:
        - onFail: MARK_RAN
          not:
            - columnExists:
                schemaName: ${db_schema}
                tableName: stream
                columnName: nti_market
      changes:
        - addColumn:
            schemaName: ${db_schema}
            tableName: stream
            columns:
              - column:
                  name: nti_market
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
  - changeSet:
      id: update-db-schema-4
      author: Arseniy Karmanov
      preConditions:
        - onFail: MARK_RAN
          not:
            - columnExists:
                schemaName: ${db_schema}
                tableName: team_card
                columnName: enabled
      changes:
        - addColumn:
            schemaName: ${db_schema}
            tableName: team_card
            columns:
              - column:
                  name: enabled
                  type: boolean
                  constraints:
                    nullable: false
                  defaultValue: true