databaseChangeLog:
  - changeSet:
      id: add-report-indexes-1
      author: developer
      runInTransaction: false
      preConditions:
        - onFail: MARK_RAN
          not:
            - indexExists:
                schemaName: ${db_schema}
                indexName: idx_tc_username_avg_grade
      changes:
        - sql:
            dbms: postgresql
            sql: |
              CREATE INDEX CONCURRENTLY idx_tc_username_avg_grade
                  ON ${db_schema}.team_card (username)
                  INCLUDE (average_grade);
      rollback:
        - sql:
            dbms: postgresql
            sql: DROP INDEX CONCURRENTLY IF EXISTS ${db_schema}.idx_tc_username_avg_grade;

