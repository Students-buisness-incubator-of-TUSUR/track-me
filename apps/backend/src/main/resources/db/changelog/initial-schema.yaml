databaseChangeLog:
  - changeSet:
      id: project-place-2
      author: Arseniy Karmanov
      preConditions:
        - onFail: MARK_RAN
          not:
            - tableExists:
                schemaName: ${db_schema}
                tableName: team_card
      changes:
        - createTable:
            tableName: team_card
            schemaName: ${db_schema}
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
                  constraints:
                    nullable: true
              - column:
                  name: status
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: username
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
  - changeSet:
      id: project-place-3
      author: Arseniy Karmanov
      preConditions:
        - onFail: MARK_RAN
          not:
            - tableExists:
                tableName: meeting
      changes:
        - createTable:
            tableName: meeting
            schemaName: ${db_schema}
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: team_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: link
                  type: VARCHAR(255)
                  constraints:
                    nullable: true
              - column:
                  name: number
                  type: VARCHAR(32)
                  constraints:
                    nullable: true
              - column:
                  name: start_date
                  type: DATETIME
                  constraints:
                    nullable: false
              - column:
                  name: screenshot
                  type: BLOB
                  constraints:
                    nullable: true
              - column:
                  name: status
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: meeting
            baseColumnNames: team_id
            referencedTableName: team_card
            referencedColumnNames: id
            constraintName: fk_meetings_team
            baseTableSchemaName: ${db_schema}
            referencedTableSchemaName: ${db_schema}
  - changeSet:
      id: project-place-4
      author: Arseniy Karmanov
      preConditions:
        - onFail: MARK_RAN
          not:
            - tableExists:
                tableName: stream
      changes:
        - createTable:
            tableName: stream
            schemaName: ${db_schema}
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: start_date
                  type: DATE
                  constraints:
                    nullable: true
              - column:
                  name: end_date
                  type: DATE
                  constraints:
                    nullable: true
              - column:
                  name: teams_count
                  type: INTEGER
                  constraints:
                    nullable: true
  - changeSet:
      id: project-place-6
      author: Arseniy Karmanov
      preConditions:
        - onFail: MARK_RAN
          not:
            - tableExists:
                tableName: stream_team_card
      changes:
        - createTable:
            tableName: stream_team_card
            schemaName: ${db_schema}
            columns:
              - column:
                  name: stream_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: team_id
                  type: UUID
                  constraints:
                    nullable: false
        - addPrimaryKey:
            columnNames: stream_id, team_id
            tableName: stream_team_card
            schemaName: ${db_schema}
            constraintName: pk_streams_team_cards
        - addForeignKeyConstraint:
            baseTableName: stream_team_card
            baseColumnNames: stream_id
            referencedTableName: stream
            referencedColumnNames: id
            constraintName: fk_streams_team_cards_stream
            baseTableSchemaName: ${db_schema}
            referencedTableSchemaName: ${db_schema}
        - addForeignKeyConstraint:
            baseTableName: stream_team_card
            baseColumnNames: team_id
            referencedTableName: team_card
            referencedColumnNames: id
            constraintName: fk_streams_team_cards_team
            baseTableSchemaName: ${db_schema}
            referencedTableSchemaName: ${db_schema}
  - changeSet:
      id: project-place-12
      author: akarmanov
      preConditions:
        - onFail: MARK_RAN
          not:
            - tableExists:
                schemaName: ${db_schema}
                tableName: nti_market
      changes:
        - createTable:
            tableName: nti_market
            schemaName: ${db_schema}
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    unique: true
                    nullable: false
              - column:
                  name: display_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: true
  - changeSet:
      id: project-place-13
      author: akarmanov
      preConditions:
        - onFail: MARK_RAN
          not:
            - tableExists:
                schemaName: ${db_schema}
                tableName: stream_nti_market
      changes:
        - createTable:
            tableName: stream_nti_market
            schemaName: ${db_schema}
            columns:
              - column:
                  name: stream_id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: nti_market_id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
  - changeSet:
      id: project-place-14
      author: akarmanov
      changes:
        - dropNotNullConstraint:
            tableName: meeting
            columnName: status
            schemaName: ${db_schema}
  - changeSet:
      id: project-place-16
      author: akarmanov
      changes:
        - createTable:
            tableName: team_card_nti_market
            schemaName: ${db_schema}
            columns:
              - column:
                  name: team_card_id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: nti_market_id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: team_card_nti_market
            baseColumnNames: team_card_id
            referencedTableName: team_card
            referencedColumnNames: id
            constraintName: fk_team_card_nti_market_team_card
            baseTableSchemaName: ${db_schema}
            referencedTableSchemaName: ${db_schema}
        - addForeignKeyConstraint:
            baseTableName: team_card_nti_market
            baseColumnNames: nti_market_id
            referencedTableName: nti_market
            referencedColumnNames: id
            constraintName: fk_team_card_nti_market_nti_market
            baseTableSchemaName: ${db_schema}
            referencedTableSchemaName: ${db_schema}

