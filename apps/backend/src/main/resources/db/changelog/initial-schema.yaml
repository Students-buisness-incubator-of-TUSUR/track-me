              - column:
                  name: team_id
                  type: UUID
                  constraints:
                    nullable: false
        - addPrimaryKey:
            columnNames: stream_id, team_id
            tableName: stream_team_card
            constraintName: pk_streams_team_cards
        - addForeignKeyConstraint:
            baseTableName: stream_team_card
            baseColumnNames: stream_id
            referencedTableName: stream
            referencedColumnNames: id
            constraintName: fk_streams_team_cards_stream
        - addForeignKeyConstraint:
            baseTableName: stream_team_card
            baseColumnNames: team_id
            referencedTableName: team_card
            referencedColumnNames: id
            constraintName: fk_streams_team_cards_team
  - changeSet:
      id: project-place-9
      author: Arseniy Karmanov
      preConditions:
        - onFail: MARK_RAN
          not:
            - tableExists:
                tableName: stream_user
      changes:
        - createTable:
            tableName: stream_user
            columns:
              - column:
                  name: stream_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
        - addPrimaryKey:
            columnNames: stream_id, user_id
