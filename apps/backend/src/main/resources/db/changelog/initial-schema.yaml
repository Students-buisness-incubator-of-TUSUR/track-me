databaseChangeLog:
  - changeSet:
      id: project-place-1
      author: Arseniy Karmanov
      preConditions:
        - onFail: MARK_RAN
          not:
            - tableExists:
                tableName: pp_user
      changes:
        - createTable:
            tableName: pp_user
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: first_name
                  type: VARCHAR(255)
              - column:
                  name: password
                  type: VARCHAR(255)
                  constraints:
                    unique: true
                    nullable: false
              - column:
                  name: last_name
                  type: VARCHAR(255)
              - column:
                  name: middle_name
                  type: VARCHAR(255)
              - column:
                  name: phone_number
                  type: VARCHAR(32)
                  constraints:
                    unique: true
              - column:
                  name: telegram_id
                  type: VARCHAR(32)
                  constraints:
                    unique: true
                    nullable: false
              - column:
                  name: role
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            columnNames: telegram_id, phone_number
            tableName: pp_user
            constraintName: uq_users_telegram_phone
  - changeSet:
      id: project-place-2
      author: Arseniy Karmanov
      preConditions:
        - onFail: MARK_RAN
          not:
            - tableExists:
                tableName: team_card
      changes:
        - createTable:
            tableName: team_card
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
                  constraints:
                    nullable: true
              - column:
                  name: status
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
  - changeSet:
      id: project-place-3
      author: Arseniy Karmanov
      preConditions:
        - onFail: MARK_RAN
          not:
            - tableExists:
                tableName: meeting
      changes:
        - createTable:
            tableName: meeting
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: team_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: link
                  type: VARCHAR(255)
                  constraints:
                    nullable: true
              - column:
                  name: number
                  type: VARCHAR(32)
                  constraints:
                    nullable: true
              - column:
                  name: start_date
                  type: DATETIME
                  constraints:
                    nullable: false
              - column:
                  name: screenshot
                  type: BLOB
                  constraints:
                    nullable: true
              - column:
                  name: status
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: meeting
            baseColumnNames: team_id
            referencedTableName: team_card
            referencedColumnNames: id
            constraintName: fk_meetings_team
  - changeSet:
      id: project-place-4
      author: Arseniy Karmanov
      preConditions:
        - onFail: MARK_RAN
