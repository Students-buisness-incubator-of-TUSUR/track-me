logging:
  level:
    net:
      akarmanov:
        projectplace:
          services:
            acl: DEBUG
spring:
  application:
    name: project-place-backend
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/project-place-test
    username: postgres
    password: postgres
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    database: postgresql

  liquibase:
    enabled: true

app:
  acl:
    class-identity-query: "select currval(pg_get_serial_sequence('acl_class', 'id'))"
    sid-identity-query: "select currval(pg_get_serial_sequence('acl_sid', 'id'))"

  superadmin:
    username: ${ADMIN_USERNAME:superadmin}
    password: ${ADMIN_PASSWORD:superadmin}