components:
  schemas:
    RestError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        errors:
          type: array
          items:
            type: string
    StreamUpdateDto:
      required:
        - endDate
        - name
      type: object
      properties:
        name:
          type: string
        endDate:
          type: string
          format: date
        readinessLevel:
          type: string
          enum:
            - LEVEL_1
            - LEVEL_2
            - LEVEL_3
            - LEVEL_4
        ntiMarket:
          type: string
          enum:
            - AERO_NET
            - AUTO_NET
            - ECO_NET
            - EDUCATION_NET
            - ENERGY_NET
            - FOOD_NET
            - GAME_NET
            - HEALTH_NET
            - HOME_NET
            - MARI_NET
            - NEURO_NET
            - SAFE_NET
            - SPORT_NET
            - TECH_NET
            - WEAR_NET
    StreamDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        ntiMarket:
          type: string
        readinessLevel:
          type: string
    UserUpdateDTO:
      required:
        - firstName
        - lastName
        - middleName
        - phoneNumber
        - telegramId
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        middleName:
          type: string
        phoneNumber:
          pattern: "^\\+7\\d{10}$"
          type: string
          description: Номер телефона в формате +7XXXXXXXXXX
          example: "+71234567890"
        telegramId:
          type: string
        email:
          type: string
      description: DTO для обновления данных пользователя
    UserDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        middleName:
          type: string
        phoneNumber:
          type: string
        telegramId:
          type: string
        email:
          type: string
        role:
          type: string
          enum:
            - ADMIN
            - SUPER_ADMIN
            - TRACKER
        photo:
          $ref: "#/components/schemas/UserPhotoDto"
        enabled:
          type: boolean
    UserPhotoDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        fileName:
          type: string
        photo:
          type: array
          items:
            type: string
            format: byte
    TeamCardCreateOrUpdateDto:
      required:
        - name
      type: object
      properties:
        name:
          type: string
          description: Название карточки команды
          example: Карточка команды
        description:
          type: string
          description: Описание карточки команды
          example: Описание карточки команды
      description: DTO для создания/обновления карточки команды
    TeamCardDto:
      type: object
      properties:
        id:
          type: string
          description: Идентификатор карточки команды
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        name:
          type: string
          description: Название карточки команды
          example: Карточка команды
        description:
          type: string
          description: Описание карточки команды
          example: Описание карточки команды
        status:
          type: string
          description: Статус карточки команды
          example: Все ок
          enum:
            - OK
            - HAS_ISSUES
            - HAS_MAJOR_ISSUES
        userId:
          type: string
          description: Идентификатор пользователя
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        enabled:
          type: boolean
      description: DTO для карточки команды
    TaskUpdateDto:
      required:
        - id
      type: object
      properties:
        id:
          type: string
          format: uuid
        description:
          type: string
        status:
          type: string
        link:
          type: string
    TaskDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        link:
          type: string
        number:
          type: integer
          format: int32
        description:
          type: string
        status:
          type: string
        meetingId:
          type: string
          format: uuid
      description: Задача на встречу
    TaskCreateDto:
      required:
        - description
        - link
      type: object
      properties:
        description:
          type: string
          description: Описание задачи
        link:
          type: string
          description: Ссылка на задачу
      description: DTO создания задачи на встречу
    MeetingUpdateDto:
      required:
        - link
        - number
        - status
      type: object
      properties:
        link:
          pattern: ^(http|https)://.*$
          type: string
          description: Ссылка на встречу
        number:
          type: string
          description: Номер встречи
        status:
          type: string
          description: Статус встречи
          enum:
            - OK
            - WITH_ISSUES
            - MANY_ISSUES
      description: DTO обновления встречи команды
    MeetingDto:
      type: object
      properties:
        id:
          type: string
          description: Идентификатор встречи
          format: uuid
        link:
          type: string
          description: Ссылка на встречу
        number:
          type: string
          description: Номер встречи
        startDate:
          type: string
          description: Дата начала встречи
          format: date-time
        status:
          type: string
          description: Статус встречи
          enum:
            - OK
            - WITH_ISSUES
            - MANY_ISSUES
        teamCardId:
          type: string
          description: Идентификатор карточки команды
        tasks:
          uniqueItems: true
          type: array
          description: Список задач на встречу
          items:
            $ref: "#/components/schemas/TaskDto"
      description: DTO встречи команды
    MeetingCreateDto:
      required:
        - link
        - number
      type: object
      properties:
        link:
          pattern: ^(http|https)://.*$
          type: string
          description: Ссылка на встречу
        number:
          type: string
          description: Номер встречи
        startDate:
          type: string
          description: Дата начала встречи
          format: date-time
      description: DTO создания встречи команды
    SingUpRequest:
      required:
        - password
        - phoneNumber
        - role
        - telegramId
      type: object
      properties:
        password:
          maxLength: 20
          minLength: 6
          type: string
          description: Пароль.
        firstName:
          maxLength: 255
          minLength: 0
          type: string
          description: Имя.
        lastName:
          maxLength: 255
          minLength: 0
          type: string
          description: Фамилия.
        middleName:
          maxLength: 255
          minLength: 0
          type: string
          description: Отчество.
        phoneNumber:
          pattern: "^\\+7\\d{10}$"
          type: string
          description: Номер телефона.
        telegramId:
          maxLength: 32
          minLength: 0
          type: string
          description: Telegram ID.
        email:
          type: string
          description: Адрес электронной почты.
        role:
          type: string
          description: Роль.
          enum:
            - ADMIN
            - TRACKER
            - SUPER_ADMIN
      description: Запрос на регистрацию.
    SingInRequest:
      required:
        - password
        - telegramId
      type: object
      properties:
        telegramId:
          maxLength: 20
          minLength: 4
          type: string
          description: Telegram ID.
        password:
          maxLength: 20
          minLength: 6
          type: string
          description: Пароль.
      description: Запрос на аутентификацию.
    JwtAuthenticationResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: Токен.
        tokenType:
          type: string
          description: Тип токена.
      description: Ответ на аутентификацию.
    StreamCreateDto:
      required:
        - endDate
        - name
        - ntiMarket
        - readinessLevel
      type: object
      properties:
        name:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        readinessLevel:
          type: string
          enum:
            - LEVEL_1
            - LEVEL_2
            - LEVEL_3
            - LEVEL_4
        ntiMarket:
          type: string
          enum:
            - AERO_NET
            - AUTO_NET
            - ECO_NET
            - EDUCATION_NET
            - ENERGY_NET
            - FOOD_NET
            - GAME_NET
            - HEALTH_NET
            - HOME_NET
            - MARI_NET
            - NEURO_NET
            - SAFE_NET
            - SPORT_NET
            - TECH_NET
            - WEAR_NET
    PageMetadata:
      type: object
      properties:
        size:
          type: integer
          format: int64
        number:
          type: integer
          format: int64
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int64
    PagedModelTeamCardDto:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/TeamCardDto"
        page:
          $ref: "#/components/schemas/PageMetadata"
    PagedModelStreamDto:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/StreamDto"
        page:
          $ref: "#/components/schemas/PageMetadata"
    PagedModelMeetingDto:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/MeetingDto"
        page:
          $ref: "#/components/schemas/PageMetadata"
    PageUserDTO:
      type: object
      properties:
        totalPages:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        first:
          type: boolean
        last:
          type: boolean
        size:
          type: integer
          format: int32
        content:
          type: array
          items:
            $ref: "#/components/schemas/UserDTO"
        number:
          type: integer
          format: int32
        sort:
          type: array
          items:
            $ref: "#/components/schemas/SortObject"
        pageable:
          $ref: "#/components/schemas/PageableObject"
        numberOfElements:
          type: integer
          format: int32
        empty:
          type: boolean
    PageableObject:
      type: object
      properties:
        offset:
          type: integer
          format: int64
        sort:
          type: array
          items:
            $ref: "#/components/schemas/SortObject"
        paged:
          type: boolean
        pageNumber:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        unpaged:
          type: boolean
    SortObject:
      type: object
      properties:
        direction:
          type: string
        nullHandling:
          type: string
        ascending:
          type: boolean
        property:
          type: string
        ignoreCase:
          type: boolean
