server:
  port: 8081
  forward-headers-strategy: framework
app:
  after-login-url: ${AFTER_LOGIN_URL:http://127.0.0.1:8081}
  after-logout-uri: ${AFTER_LOGOUT_URI:http://127.0.0.1:8081}
  logout-uri: ${LOGOUT_URI:http://localhost:9000/connect/logout}
  session-cookie:
    same-site: ${SESSION_COOKIE_SAME_SITE:Lax}
    secure: ${SESSION_COOKIE_SECURE:false}
    domain: ${SESSION_COOKIE_DOMAIN:}
  cors:
    # Use allowedOriginPatterns for development to support localhost variations
    # In production, use explicit allowedOrigins via environment variables
    allowed-origin-patterns: ${CORS_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
    allowed-origins: ${CORS_ORIGINS:}
    # Restrict allowed headers to commonly used ones instead of wildcard
    allowed-headers: ${CORS_ALLOWED_HEADERS:Authorization,Content-Type,Accept,Origin,X-Requested-With,X-CSRF-TOKEN}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS,PATCH}
    # Expose custom headers that frontend might need to read
    exposed-headers: ${CORS_EXPOSED_HEADERS:X-CSRF-TOKEN,Authorization}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}

spring:
  application:
    name: track-me-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USER:trackme-redis}
      password: ${REDIS_USER_PASSWORD:trackme-redis}
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
  session:
    redis:
      namespace: "trackme:gateway:session"
      flush-mode: immediate
    timeout: 30m
  cloud:
    gateway:
      routes:
        - id: trackme-backend
          uri: http://trackme-backend:8080
          predicates:
            - Path=/backend/**
          filters:
            - TokenRelay
            - StripPrefix=1
        - id: trackme-meeting-service
          uri: http://trackme-meeting-service:8082
          predicates:
            - Path=/meeting/**
          filters:
            - TokenRelay
            - StripPrefix=1
        - id: trackme-sso
          uri: http://trackme-sso:9000
          predicates:
            - Path=/sso/**
          filters:
            - TokenRelay
            - StripPrefix=1
  security:
    oauth2:
      client:
        registration:
          track-me-client:
            client-id: ${TRACKME_CLIENT_ID:track-me-client}
            client-secret: ${TRACKME_CLIENT_SECRET:password}
            provider: track-me-client
            client-name: TrackMe SSO
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid, profile
        provider:
          track-me-client:
            issuer-uri: ${SSO_URI:http://localhost:9000}
logging:
  level:
    # Use info level by default, override to debug/trace only when needed
    org.springframework.security: ${SECURITY_LOG_LEVEL:info}
    org.springframework.cloud.gateway: ${GATEWAY_LOG_LEVEL:info}

springdoc:
  swagger-ui:
    enabled: true
    doc-expansion: none
    operationsSorter: method
    tagsSorter: alpha
    try-it-out-enabled: true
    urls:
      - name: TrackMe SSO
        url: ${BACKEND_URI:http://127.0.0.1:8081}/sso/v3/api-docs
      - name: TrackMe Backend
        display-name: TrackMe Backend
        url: ${BACKEND_URI:http://127.0.0.1:8081}/backend/v3/api-docs
      - name: TrackMe Meeting Service
        display-name: TrackMe Meeting Service
        url: ${BACKEND_URI:http://127.0.0.1:8081}/meeting/v3/api-docs
    with-credentials: true
    use-root-path: true
    path: /swagger-ui
  api-docs:
    enabled: true

---
spring:
  config:
    activate:
      on-profile: development
  cloud:
    gateway:
      routes:
        - id: trackme-backend
          uri: http://localhost:8080
          predicates:
            - Path=/backend/**
          filters:
            - TokenRelay
            - StripPrefix=1
        - id: trackme-meeting-service
          uri: http://localhost:8082
          predicates:
            - Path=/meeting/**
          filters:
            - TokenRelay
            - StripPrefix=1
        - id: trackme-sso
          uri: http://localhost:9000
          predicates:
            - Path=/sso/**
          filters:
            - TokenRelay
            - StripPrefix=1
---
spring:
  config:
    activate:
      on-profile: docker-local
  security:
    oauth2:
      client:
        provider:
          track-me-client:
            # host.docker.internal: used for internal OIDC discovery and JWT validation
            # (container-to-container via host). Must match SSO_URI / SSO issuer.
            issuer-uri: http://host.docker.internal:9000
            # localhost:9000: used for browser redirects to SSO login/logout pages.
            # SSO exposes port 9000, so the browser on the host reaches it directly.
            authorization-uri: http://localhost:9000/oauth2/authorize

---
# Production profile with strict security settings
spring:
  config:
    activate:
      on-profile: production

app:
  session-cookie:
    # Production cookies must be secure and use strict same-site
    same-site: ${SESSION_COOKIE_SAME_SITE:Strict}
    secure: ${SESSION_COOKIE_SECURE:true}
    domain: ${SESSION_COOKIE_DOMAIN:}
  cors:
    # Production MUST use explicit allowed origins, no patterns
    # Configure via CORS_ORIGINS environment variable
    allowed-origins: ${CORS_ORIGINS}
    allowed-origin-patterns: ${CORS_ORIGIN_PATTERNS:}
    allowed-headers: ${CORS_ALLOWED_HEADERS:Authorization,Content-Type,Accept,Origin,X-Requested-With,X-CSRF-TOKEN}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS,PATCH}
    exposed-headers: ${CORS_EXPOSED_HEADERS:X-CSRF-TOKEN,Authorization}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}

logging:
  level:
    # Production logging should be minimal for performance
    org.springframework.security: ${SECURITY_LOG_LEVEL:warn}
    org.springframework.cloud.gateway: ${GATEWAY_LOG_LEVEL:info}

springdoc:
  swagger-ui:
    # Disable Swagger UI in production for security
    enabled: ${SWAGGER_ENABLED:false}
