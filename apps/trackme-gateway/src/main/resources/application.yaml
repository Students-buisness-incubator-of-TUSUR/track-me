server:
  port: 8081

app:
  after-login-url: ${AFTER_LOGIN_URL:http://127.0.0.1:8081}
  after-logout-uri: ${AFTER_LOGOUT_URI:http://127.0.0.1:8081}
  session-cookie:
    same-site: ${SESSION_COOKIE_SAME_SITE:Lax}
    secure: ${SESSION_COOKIE_SECURE:false}
    domain: ${SESSION_COOKIE_DOMAIN:}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
    allowed-headers: ${CORS_ALLOWED_HEADERS:*}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS,PATCH}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}

spring:
  application:
    name: track-me-gateway
  cloud:
    gateway:
      routes:
        - id: trackme-backend
          uri: http://trackme-backend:8080
          predicates:
            - Path=/backend/**
          filters:
            - TokenRelay
            - StripPrefix=1
        - id: trackme-meeting-service
          uri: http://trackme-meeting-service:8082
          predicates:
            - Path=/meeting/**
          filters:
            - TokenRelay
            - StripPrefix=1
        - id: trackme-sso
          uri: http://trackme-sso:9000
          predicates:
            - Path=/sso/**
          filters:
            - TokenRelay
            - StripPrefix=1
  security:
    oauth2:
      client:
        registration:
          track-me-client:
            client-id: ${TRACKME_CLIENT_ID:track-me-client}
            client-secret: ${TRACKME_CLIENT_SECRET:password}
            provider: track-me-client
            client-name: TrackMe SSO
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid, profile
        provider:
          track-me-client:
            issuer-uri: ${SSO_URI:http://localhost:9000}
logging:
  level:
    org.springframework.security: trace
    org.springframework.cloud.gateway: debug

springdoc:
  swagger-ui:
    enabled: true
    doc-expansion: none
    operationsSorter: method
    tagsSorter: alpha
    try-it-out-enabled: true
    urls:
      - name: TrackMe SSO
        url: ${BACKEND_URI:http://127.0.0.1:8081}/sso/v3/api-docs
      - name: TrackMe Backend
        display-name: TrackMe Backend
        url: ${BACKEND_URI:http://127.0.0.1:8081}/backend/v3/api-docs
      - name: TrackMe Meeting Service
        display-name: TrackMe Meeting Service
        url: ${BACKEND_URI:http://127.0.0.1:8081}/meeting/v3/api-docs
    with-credentials: true
    use-root-path: true
  api-docs:
    enabled: true

---
spring:
  config:
    activate:
      on-profile: development
  cloud:
    gateway:
      routes:
        - id: trackme-backend
          uri: http://localhost:8080
          predicates:
            - Path=/backend/**
          filters:
            - TokenRelay
            - StripPrefix=1
        - id: trackme-meeting-service
          uri: http://localhost:8082
          predicates:
            - Path=/meeting/**
          filters:
            - TokenRelay
            - StripPrefix=1
        - id: trackme-sso
          uri: http://localhost:9000
          predicates:
            - Path=/sso/**
          filters:
            - TokenRelay
            - StripPrefix=1
---
spring:
  config:
    activate:
      on-profile: docker-local
  cloud:
    gateway:
      routes:
        - id: trackme-backend
          uri: http://host.docker.internal:8080
          predicates:
            - Path=/backend/**
          filters:
            - TokenRelay
            - StripPrefix=1
        - id: trackme-sso
          uri: http://host.docker.internal:9000
          predicates:
            - Path=/sso/**
          filters:
            - TokenRelay
            - StripPrefix=1
        - id: trackme-meeting-service
          uri: http://host.docker.internal:8082
          predicates:
            - Path=/meeting/**
          filters:
            - TokenRelay
            - StripPrefix=1
  security:
    oauth2:
      client:
        registration:
          track-me-client:
            client-id: ${TRACKME_CLIENT_ID:track-me-client}
            client-secret: ${TRACKME_CLIENT_SECRET:password}
            provider: track-me-client
            client-name: TrackMe SSO
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid, profile
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
        provider:
          track-me-client:
            issuer-uri: http://host.docker.internal:9000
            authorization-uri: http://localhost:9000/oauth2/authorize

springdoc:
