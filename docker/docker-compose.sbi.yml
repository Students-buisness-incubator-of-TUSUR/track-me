services:
  backend:
    image: ghcr.io/akarmanov2022/track-me/backend
    container_name: track-me-backend
    platform: linux/amd64
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - backend_data:/usr/src/app

  frontend:
    image: ghcr.io/akarmanov2022/track-me/frontend
    container_name: track-me-frontend
    platform: linux/amd64
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - frontend_data:/usr/src/app

volumes:
  frontend_data:
    driver: local
  backend_data:
    driver: local