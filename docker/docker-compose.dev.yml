services:
  redis:
    image: redis:latest
    env_file:
      - .env
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - ./redisdata:/data
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    command: >
      sh -c '
        cat .env.dev.redis >> .env
        mkdir -p /usr/local/etc/redis &&
        echo "bind 0.0.0.0" > /usr/local/etc/redis/redis.conf &&
        echo "requirepass ${REDIS_PASSWORD}" >> /usr/local/etc/redis/redis.conf &&
        echo "appendonly yes" >> /usr/local/etc/redis/redis.conf &&
        echo "appendfsync everysec" >> /usr/local/etc/redis/redis.conf &&
        echo "user default on nopass ~* +@all" > /usr/local/etc/redis/users.acl &&
        echo "user ${REDIS_USER} on >${REDIS_USER_PASSWORD} ~* +@all" >> /usr/local/etc/redis/users.acl &&
        redis-server /usr/local/etc/redis/redis.conf --aclfile /usr/local/etc/redis/users.acl
      '
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "$REDIS_PASSWORD", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    tty: true
    stdin_open: true
    networks:
      - demo

  trackme-backend:
    image: ghcr.io/akarmanov2022/track-me/backend:latest
    platform: linux/amd64
    restart: always
    env_file:
      - .env
    depends_on:
      - redis
    ports:
      - '8080:8080'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - demo
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5

  trackme-sso:
    image: ghcr.io/akarmanov2022/track-me/sso:latest
    platform: linux/amd64
    restart: always
    depends_on:
      - redis
    env_file:
      - .env
    ports:
      - '9000:9000'
    networks:
      - demo
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5

  trackme-client-gateway:
    image: ghcr.io/akarmanov2022/track-me/gateway:latest
    platform: linux/amd64
    restart: always
    depends_on:
      - backend
      - sso
    env_file:
      - .env
      - .env.dev.redis
    ports:
      - '8081:8081'
    networks:
      - demo
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5

  trackme-frontend:
    image: ghcr.io/akarmanov2022/track-me/frontend:latest
    platform: linux/amd64
    env_file:
      - .env
      - .env.dev.redis
    depends_on:
      - backend
    ports:
      - '3000:3000'
    networks:
      - demo
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  demo:
    driver: bridge
    external: true