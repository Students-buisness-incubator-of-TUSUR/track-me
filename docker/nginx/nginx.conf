upstream trackme_gateway {
    server trackme-client-gateway:8081;
}

upstream trackme_frontend {
    server trackme-frontend:3000;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 100m;

    # Swagger UI and API docs (served by Spring Cloud Gateway)
    location ~ ^/(swagger-ui|v3/api-docs|webjars)(/|$) {
        proxy_pass http://trackme_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host                $host;
        proxy_set_header X-Real-IP           $remote_addr;
        proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto   $scheme;
        proxy_set_header X-Forwarded-Host    $host;
        proxy_set_header X-Forwarded-Port    $server_port;
    }

    # Spring Cloud Gateway: API, auth, OAuth2 flows, CSRF
    location ~ ^/(backend|meeting|sso|login|logout|oauth2|csrf)(/|$) {
        proxy_pass http://trackme_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host                $host;
        proxy_set_header X-Real-IP           $remote_addr;
        proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto   $scheme;
        proxy_set_header X-Forwarded-Host    $host;
        proxy_set_header X-Forwarded-Port    $server_port;
        proxy_read_timeout 60s;
    }

    # Frontend (Next.js) with WebSocket support for HMR
    location / {
        proxy_pass http://trackme_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade             $http_upgrade;
        proxy_set_header Connection          "upgrade";
        proxy_set_header Host                $host;
        proxy_set_header X-Real-IP           $remote_addr;
        proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto   $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
