# Host-nginx для PROD-стенда Track Me (НЕ монтируется в контейнер — ставится на сервер вручную).
#
#   sudo cp trackme-prod.conf /etc/nginx/sites-available/trackme-prod
#   sudo ln -s /etc/nginx/sites-available/trackme-prod /etc/nginx/sites-enabled/trackme-prod
#   sudo nginx -t && sudo systemctl reload nginx
#
# Сертификат (один на три имени), выпускается до включения этого конфига:
#   sudo certbot certonly --nginx -d trackme.startup-poligon.com \
#       -d api.trackme.startup-poligon.com -d sso.trackme.startup-poligon.com
#
# Порты 13000/18081/19000 публикует docker/docker-compose.prod.yaml только на 127.0.0.1.

# WebSocket: Connection: upgrade только когда клиент его просит (имя уникально, чтобы не конфликтовать с dev).
map $http_upgrade $trackme_prod_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name trackme.startup-poligon.com api.trackme.startup-poligon.com sso.trackme.startup-poligon.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name trackme.startup-poligon.com;

    client_max_body_size 100m;

    ssl_certificate /etc/letsencrypt/live/trackme.startup-poligon.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trackme.startup-poligon.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:13000;  # frontend
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $trackme_prod_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.trackme.startup-poligon.com;

    client_max_body_size 100m;

    ssl_certificate /etc/letsencrypt/live/trackme.startup-poligon.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trackme.startup-poligon.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:18081;  # gateway
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $trackme_prod_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sso.trackme.startup-poligon.com;

    client_max_body_size 100m;

    ssl_certificate /etc/letsencrypt/live/trackme.startup-poligon.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trackme.startup-poligon.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:19000;  # SSO
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $trackme_prod_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
    }
}
