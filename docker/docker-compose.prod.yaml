# Production-стенд Track Me (trackme.startup-poligon.com).
#
# Образы тянутся из GHCR по НЕИЗМЕНЯЕМОМУ тегу релиза (IMAGE_TAG=vX.Y.Z), который workflow
# deploy-prod кладёт в .env. Здесь нет build/develop.watch — только pull.
#
# Workflow копирует этот файл в ~/track-me-prod/docker/, а .env и database/ лежат в ~/track-me-prod,
# поэтому запускать ТОЛЬКО из ~/track-me-prod как отдельный compose-проект:
#   docker compose -p track-me-prod --project-directory . -f docker/docker-compose.prod.yaml up -d
#
# Внешний доступ — через host-nginx на сервере (TLS, конфиг docker/nginx/host/trackme-prod.conf):
#   trackme.startup-poligon.com     → 127.0.0.1:13000 (frontend)
#   api.trackme.startup-poligon.com → 127.0.0.1:18081 (gateway)
#   sso.trackme.startup-poligon.com → 127.0.0.1:19000 (sso)
#
# Изоляция от dev на том же хосте:
#   * отдельный project name (-p track-me-prod) → свои сети и volume'ы;
#   * порты публикуются только на 127.0.0.1 и не пересекаются с dev; БД/Redis/Kafka наружу не торчат;
#   * нет container_name → имена контейнеров неймспейсятся проектом (нет коллизий с dev).
#
# Все прикладные значения (домены, секреты, cookie/CORS, IMAGE_*) берутся из .env (см. .env.prod.example).

services:
  trackme-postgres:
    image: postgres:16
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./database/init_schemas.sql:/docker-entrypoint-initdb.d/init_schemas.sql
    networks:
      - trackme-net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 30s
      timeout: 10s
      retries: 5

  trackme-redis:
    image: redis:7-alpine
    env_file:
      - .env
    volumes:
      - redis_data:/data
    networks:
      - trackme-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    command: >
      sh -c '
        mkdir -p /usr/local/etc/redis &&
        echo "bind 0.0.0.0" > /usr/local/etc/redis/redis.conf &&
        echo "requirepass $REDIS_PASSWORD" >> /usr/local/etc/redis/redis.conf &&
        echo "appendonly yes" >> /usr/local/etc/redis/redis.conf &&
        echo "appendfsync everysec" >> /usr/local/etc/redis/redis.conf &&
        echo "user default on nopass ~* +@all" > /usr/local/etc/redis/users.acl &&
        echo "user $REDIS_USER on >$REDIS_USER_PASSWORD ~* +@all" >> /usr/local/etc/redis/users.acl &&
        redis-server /usr/local/etc/redis/redis.conf --aclfile /usr/local/etc/redis/users.acl
      '
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep PONG" ]
      interval: 30s
      timeout: 10s
      retries: 5

  trackme-kafka:
    # Без container_name: на общем хосте имя trackme-kafka уже занято dev-стендом.
    image: apache/kafka:4.1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://trackme-kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@trackme-kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
      # По умолчанию образ пишет в /tmp/kraft-combined-logs — данные терялись бы при пересоздании.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - trackme-net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1" ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s

  trackme-backend:
    image: ${IMAGE_REPO:-ghcr.io/students-buisness-incubator-of-tusur/track-me}/backend:${IMAGE_TAG:-latest}
    platform: linux/amd64
    env_file:
      - .env
    depends_on:
      trackme-postgres:
        condition: service_healthy
      trackme-redis:
        condition: service_healthy
    networks:
      - trackme-net
    restart: unless-stopped
    # ВНИМАНИЕ(ops): монтирование docker.sock даёт контейнеру root-доступ к хосту.
    # Оставлено для паритета с dev; пересмотреть необходимость для prod.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5

  trackme-meeting-service:
    image: ${IMAGE_REPO:-ghcr.io/students-buisness-incubator-of-tusur/track-me}/meeting-service:${IMAGE_TAG:-latest}
    platform: linux/amd64
    env_file:
      - .env
    depends_on:
      trackme-postgres:
        condition: service_healthy
      trackme-kafka:
        condition: service_healthy
    networks:
      - trackme-net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8082/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5

  trackme-sso:
    image: ${IMAGE_REPO:-ghcr.io/students-buisness-incubator-of-tusur/track-me}/sso:${IMAGE_TAG:-latest}
    platform: linux/amd64
    env_file:
      - .env
    depends_on:
      trackme-postgres:
        condition: service_healthy
      trackme-redis:
        condition: service_healthy
    ports:
      - '127.0.0.1:19000:9000'
    networks:
      - trackme-net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5

  trackme-client-gateway:
    image: ${IMAGE_REPO:-ghcr.io/students-buisness-incubator-of-tusur/track-me}/gateway:${IMAGE_TAG:-latest}
    platform: linux/amd64
    env_file:
      - .env
    depends_on:
      trackme-sso:
        condition: service_healthy
    ports:
      - '127.0.0.1:18081:8081'
    networks:
      - trackme-net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5

  telegram-service:
    image: ${IMAGE_REPO:-ghcr.io/students-buisness-incubator-of-tusur/track-me}/telegram-service:${IMAGE_TAG:-latest}
    platform: linux/amd64
    env_file:
      - .env
    depends_on:
      trackme-postgres:
        condition: service_healthy
      trackme-kafka:
        condition: service_healthy
    networks:
      - trackme-net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8084/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5

  trackme-frontend:
    # Тег фронтенда задаётся отдельно (свой репозиторий track-me-frontend) через FRONTEND_IMAGE в .env.
    image: ${FRONTEND_IMAGE}
    platform: linux/amd64
    env_file:
      - .env
    ports:
      - '127.0.0.1:13000:3000'
    networks:
      - trackme-net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000" ]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  kafka_data:

networks:
  trackme-net:
    driver: bridge
