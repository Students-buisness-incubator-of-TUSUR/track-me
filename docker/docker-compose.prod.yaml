# Production-стенд Track Me.
#
# Образы тянутся из GHCR по НЕИЗМЕНЯЕМОМУ тегу релиза (IMAGE_TAG=vX.Y.Z), который workflow
# deploy-prod кладёт в .env рядом с этим файлом. Здесь нет build/develop.watch — только pull.
#
# Запускать ТОЛЬКО как отдельный compose-проект, чтобы не пересекаться с dev на том же хосте:
#   docker compose -p track-me-prod -f docker-compose.prod.yaml up -d
#
# Изоляция от dev:
#   * отдельный project name (-p track-me-prod) → свои сети и volume'ы;
#   * порты сервисов наружу НЕ публикуются — внешний доступ только через nginx;
#   * нет container_name → имена контейнеров неймспейсятся проектом (нет коллизий с dev).
#
# Все прикладные значения (домены, секреты, cookie/CORS, IMAGE_*) берутся из .env (см. .env.prod.example).

services:
  trackme-postgres:
    image: postgres:16
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./database/init_schemas.sql:/docker-entrypoint-initdb.d/init_schemas.sql
    networks:
      - trackme-net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 30s
      timeout: 10s
      retries: 5

  trackme-redis:
    image: redis:7-alpine
    env_file:
      - .env
    volumes:
      - redis_data:/data
    networks:
      - trackme-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    command: >
      sh -c '
        mkdir -p /usr/local/etc/redis &&
        echo "bind 0.0.0.0" > /usr/local/etc/redis/redis.conf &&
        echo "requirepass $REDIS_PASSWORD" >> /usr/local/etc/redis/redis.conf &&
        echo "appendonly yes" >> /usr/local/etc/redis/redis.conf &&
        echo "appendfsync everysec" >> /usr/local/etc/redis/redis.conf &&
        echo "user default on nopass ~* +@all" > /usr/local/etc/redis/users.acl &&
        echo "user $REDIS_USER on >$REDIS_USER_PASSWORD ~* +@all" >> /usr/local/etc/redis/users.acl &&
        redis-server /usr/local/etc/redis/redis.conf --aclfile /usr/local/etc/redis/users.acl
      '
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep PONG" ]
      interval: 30s
      timeout: 10s
      retries: 5

  trackme-kafka:
    # TODO(ops): запиннить конкретную версию (напр. bitnamilegacy/kafka:3.9) после проверки тега.
    image: bitnamilegacy/kafka:latest
    environment:
      - KAFKA_ENABLE_KRAFT=yes
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@trackme-kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://trackme-kafka:9092,PLAINTEXT_HOST://localhost:29092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR=1
      - ALLOW_PLAINTEXT_LISTENER=yes
    volumes:
      - kafka_data:/bitnami/kafka
    networks:
      - trackme-net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1" ]
      interval: 30s
      timeout: 10s
      retries: 10

  trackme-backend:
    image: ${IMAGE_REPO:-ghcr.io/students-buisness-incubator-of-tusur/track-me}/backend:${IMAGE_TAG:-latest}
    platform: linux/amd64
    env_file:
      - .env
    depends_on:
      trackme-postgres:
        condition: service_healthy
      trackme-redis:
        condition: service_healthy
    networks:
      - trackme-net
    restart: unless-stopped
    # ВНИМАНИЕ(ops): монтирование docker.sock даёт контейнеру root-доступ к хосту.
    # Оставлено для паритета с dev; пересмотреть необходимость для prod.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5

  trackme-meeting-service:
    image: ${IMAGE_REPO:-ghcr.io/students-buisness-incubator-of-tusur/track-me}/meeting-service:${IMAGE_TAG:-latest}
    platform: linux/amd64
    env_file:
      - .env
    depends_on:
      trackme-postgres:
        condition: service_healthy
      trackme-kafka:
        condition: service_healthy
    networks:
      - trackme-net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8082/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5

  trackme-sso:
    image: ${IMAGE_REPO:-ghcr.io/students-buisness-incubator-of-tusur/track-me}/sso:${IMAGE_TAG:-latest}
    platform: linux/amd64
    env_file:
      - .env
    depends_on:
      trackme-postgres:
        condition: service_healthy
      trackme-redis:
        condition: service_healthy
    networks:
      - trackme-net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5

  trackme-client-gateway:
    image: ${IMAGE_REPO:-ghcr.io/students-buisness-incubator-of-tusur/track-me}/gateway:${IMAGE_TAG:-latest}
    platform: linux/amd64
    env_file:
      - .env
    depends_on:
      trackme-sso:
        condition: service_healthy
    networks:
      - trackme-net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5

  telegram-service:
    image: ${IMAGE_REPO:-ghcr.io/students-buisness-incubator-of-tusur/track-me}/telegram-service:${IMAGE_TAG:-latest}
    platform: linux/amd64
    env_file:
      - .env
    depends_on:
      trackme-postgres:
        condition: service_healthy
      trackme-kafka:
        condition: service_healthy
    networks:
      - trackme-net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8084/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5

  trackme-frontend:
    # Тег фронтенда задаётся отдельно (свой репозиторий track-me-frontend) через FRONTEND_IMAGE в .env.
    image: ${FRONTEND_IMAGE}
    platform: linux/amd64
    env_file:
      - .env
    networks:
      - trackme-net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000" ]
      interval: 30s
      timeout: 10s
      retries: 5

  trackme-nginx:
    image: nginx:1.27-alpine
    # На общем с dev хосте dev уже держит :80 — публикуем prod на отдельном порту.
    # PROXY_HTTP_PORT задаётся в .env; перед ним рекомендуется TLS-терминирующий прокси/домен.
    ports:
      - '${PROXY_HTTP_PORT:-8000}:80'
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      trackme-client-gateway:
        condition: service_healthy
      trackme-frontend:
        condition: service_healthy
    networks:
      - trackme-net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "nginx", "-t" ]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  kafka_data:

networks:
  trackme-net:
    driver: bridge
