plugins {
    id 'java'
    id 'org.springframework.boot'
    id 'io.freefair.lombok'
    id 'net.trackme.java-quality' version '1.2.0'
}

version = '1.0.0'

dependencies {
    developmentOnly platform("net.trackme.platform:platform:${trackmePlatformVersion}")
    implementation platform("net.trackme.platform:platform:${trackmePlatformVersion}")

    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.liquibase:liquibase-core'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'org.telegram:telegrambots-spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:kafka'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.kafka:spring-kafka-test'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
    runtimeOnly 'org.postgresql:postgresql'

    implementation "net.trackme.commons:commons:${trackmePlatformVersion}"
}

test {
    useJUnitPlatform()
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
        resources {
            srcDirs = ['src/main/resources', 'database']
        }
    }
}

tasks.compileJava {
    options.errorprone.error("NonApiType")
}

