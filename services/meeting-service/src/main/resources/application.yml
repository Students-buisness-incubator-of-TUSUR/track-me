server:
  port: 8082
spring:
  profiles:
    active: development
  application:
    name: meeting-service
  datasource:
    driver-class-name: org.postgresql.Driver
    password: ${DB_PASSWORD:project-place}
    username: ${DB_USERNAME:project-place}
    url: ${DB_URL:jdbc:postgresql://postgres:5432/project-place}
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 10
      initialization-fail-timeout: 1
      leak-detection-threshold: 0
      pool-name: "HikariPool-track-me-sso"
      register-mbeans: true
      schema: ${MEETING_DB_SCHEMA:meeting_service}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
        id:
          new_generator_mappings: true
  liquibase:
    enabled: true
    default-schema: ${MEETING_DB_SCHEMA:meeting_service}
    liquibase-schema: ${MEETING_DB_SCHEMA:meeting_service}
    password: ${DB_PASSWORD:project-place}
    user: ${DB_USERNAME:project-place}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SSO_URI:http://localhost:9000}
error:
  handling:
    http-status-in-json-response: true
    exception-logging: NO_LOGGING
    full-stacktrace-http-statuses: 5xx
    log-levels:
      5xx: ERROR
springdoc:
  paths-to-match: /api/**
  swagger-ui:
    enabled: false
app:
  name: ${APP_NAME:track-me-meeting-service}
  mail:
    from: ${MAIL_FROM}
  acl:
    sid-identity-query: "select currval(pg_get_serial_sequence('acl_sid', 'id'))"
    class-identity-query: "select currval(pg_get_serial_sequence('acl_class', 'id'))"
  api-url: ${BACKEND_URI:http://127.0.0.1:8081}/meetings/
  app-url: ${FRONTEND_URI:http://127.0.0.1:3000}

---
spring:
  config:
    activate:
      on-profile: docker-local, development
  liquibase:
    contexts: dev prod
logging:
  level:
    org.springframework.security: trace

---
spring:
  config:
    activate:
      on-profile: production
  liquibase:
    contexts: prod

logging:
  level:
    root: info

---
spring:
  config:
    activate:
      on-profile: docker-local
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://host.docker.internal:9000

app:
  api-url: http://localhost:8081/meetings/