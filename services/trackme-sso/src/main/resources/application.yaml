spring:
  profiles:
    active: development
  application:
    name: trackme-sso
  security:
    oauth2:
      authorizationserver:
        issuer: http://localhost:9000
        multiple-issuers-allowed: true
      client:
        provider:
          track-me:
            issuer-uri: http://localhost:9000
  datasource:
    driver-class-name: org.postgresql.Driver
    password: ${DB_PASSWORD:project-place}
    username: ${DB_USERNAME:project-place}
    url: ${DB_URL:jdbc:postgresql://localhost:5432/project-place}
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 10
      initialization-fail-timeout: 1
      leak-detection-threshold: 0
      pool-name: "HikariPool-track-me-sso"
      register-mbeans: true
  liquibase:
    enabled: true
    change-log: classpath:db.changelog.yaml
    contexts: dev prod
    default-schema: sso
server:
  port: 9000

logging:
  level:
    org.springframework.security: trace

app:
  swagger:
    auth-types:
      auth-header-enabled: true
      client-credentials-enabled: true
      authorization-code-enabled: true
    auth-oauth:
      token-url: http://localhost:9000/oauth2/token
      authorization_url: http://localhost:9000/oauth2/authorize
      refresh-url: http://localhost:9000/oauth2/token

---
spring:
  config:
    activate:
      on-profile: production
  liquibase:
    contexts: prod

---
spring:
  config:
    activate:
      on-profile: development
  liquibase:
    contexts: prod, dev