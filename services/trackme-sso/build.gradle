plugins {
    id 'java'
    id 'war'
    id 'org.springframework.boot' version '3.4.0'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'com.github.node-gradle.node' version '7.0.2'
}

repositories {
    mavenCentral()
}

version = '1.0.0'

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-authorization-server'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.liquibase:liquibase-core'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    compileOnly 'org.projectlombok:lombok'

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'org.springframework.boot:spring-boot-docker-compose'
    runtimeOnly 'org.postgresql:postgresql'

    annotationProcessor 'org.projectlombok:lombok'

    implementation project(':commons')
}

test {
    useJUnitPlatform()
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
        resources {
            srcDirs = ['src/main/resources', 'database', 'frontend']
        }
    }
}

springBoot {
    buildInfo()
}

node {
    version = '20.8.0'
    npmVersion = '10.1.0'
    download = true
    nodeProjectDir = file("${projectDir}/frontend")
}

tasks.register('buildReact', NpmTask) {
    dependsOn npmInstall
    workingDir = file("${projectDir}/frontend")
    args = ['run', 'build']
}

// Копирование ресурсов в templates и static
tasks.register('copyFrontendResources', Copy) {
    dependsOn buildReact
    from("${projectDir}/frontend/build/static") {
        exclude "index.html"
    }
    into "${projectDir}/src/main/resources/static"
}

tasks.register('copyIndexHtml', Copy) {
    dependsOn buildReact
    from("${projectDir}/frontend/build") {
        include "index.html"
    }
    into "${projectDir}/src/main/resources/templates"
}

// Гарантируем, что это выполнится до bootJar
processResources {
    dependsOn copyIndexHtml
    dependsOn copyFrontendResources
}
