services:
  trackme-postgres:
    image: 'postgres:latest'
    env_file:
      - .env
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./database/init_schemas.sql:/docker-entrypoint-initdb.d/init_schemas.sql
    networks:
      - trackme-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U project-place -d project-place" ]
      interval: 30s
      timeout: 10s
      retries: 5

  trackme-redis:
    image: redis:latest
    ports:
      - "6380:6379"
    volumes:
      - ./redisdata:/data
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    command: >
      sh -c '
        mkdir -p /usr/local/etc/redis &&
        echo "bind 0.0.0.0" > /usr/local/etc/redis/redis.conf &&
        echo "requirepass $REDIS_PASSWORD" >> /usr/local/etc/redis/redis.conf &&
        echo "appendonly yes" >> /usr/local/etc/redis/redis.conf &&
        echo "appendfsync everysec" >> /usr/local/etc/redis/redis.conf &&
        echo "user default on nopass ~* +@all" > /usr/local/etc/redis/users.acl &&
        echo "user $REDIS_USER on >$REDIS_USER_PASSWORD ~* +@all" >> /usr/local/etc/redis/users.acl &&
        redis-server /usr/local/etc/redis/redis.conf --aclfile /usr/local/etc/redis/users.acl
      '
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep PONG" ]
      interval: 30s
      timeout: 10s
      retries: 5
    env_file:
      - .env
    restart: unless-stopped
    tty: true
    stdin_open: true
    networks:
      - trackme-net

  trackme-backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      - SPRING_PROFILES_ACTIVE=docker-local
      - BACKEND_URI=http://localhost
      - FRONTEND_URI=http://localhost
      - SSO_URI=http://host.docker.internal:9000
    platform: linux/amd64
    restart: always
    env_file:
      - .env
    depends_on:
      trackme-postgres:
        condition: service_healthy
      trackme-redis:
        condition: service_healthy
    ports:
      - '8080:8080'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - trackme-net
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
    develop:
      watch:
        - action: rebuild
          path: apps/backend/src
        - action: rebuild
          path: apps/backend/build.gradle
        - action: rebuild
          path: libs/commons/src
        - action: rebuild
          path: platform
        - action: rebuild
          path: build.gradle

  trackme-meeting-service:
    build:
      context: .
      dockerfile: services/meeting-service/Dockerfile
    platform: linux/amd64
    restart: always
    depends_on:
      trackme-postgres:
        condition: service_healthy
      trackme-kafka:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - '8082:8082'
    networks:
      - trackme-net
    environment:
      - SPRING_PROFILES_ACTIVE=docker-local
      - BACKEND_URI=http://localhost
      - FRONTEND_URI=http://localhost
      - SSO_URI=http://host.docker.internal:9000
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8082/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
    develop:
      watch:
        - action: rebuild
          path: services/meeting-service/src
        - action: rebuild
          path: libs/commons/src
        - action: rebuild
          path: platform
        - action: rebuild
          path: build.gradle

  trackme-sso:
    build:
      context: .
      dockerfile: services/trackme-sso/Dockerfile
    platform: linux/amd64
    restart: always
    depends_on:
      trackme-postgres:
        condition: service_healthy
      trackme-redis:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - '9000:9000'
    networks:
      - trackme-net
    environment:
      - SPRING_PROFILES_ACTIVE=docker-local
      - BACKEND_URI=http://localhost
      - AFTER_LOGOUT_URI=http://localhost
      - SSO_URI=http://host.docker.internal:9000
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
    develop:
      watch:
        - action: rebuild
          path: services/trackme-sso/src
        - action: rebuild
          path: libs/commons/src
        - action: rebuild
          path: platform
        - action: rebuild
          path: build.gradle

  trackme-client-gateway:
    build:
      context: .
      dockerfile: apps/trackme-gateway/Dockerfile
    platform: linux/amd64
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=docker-local
      - BACKEND_URI=http://localhost
      - AFTER_LOGIN_URL=http://localhost
      - AFTER_LOGOUT_URI=http://localhost
      - SESSION_COOKIE_SAME_SITE=Lax
      - SESSION_COOKIE_SECURE=false
      - GATEWAY_LOG_LEVEL=TRACE
      - SECURITY_LOG_LEVEL=TRACE
      - CORS_ORIGINS=http://localhost,http://localhost:3000,http://127.0.0.1:3000
    env_file:
      - .env
    networks:
      - trackme-net
    ports:
      - '8081:8081'
    depends_on:
      trackme-sso:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
    develop:
      watch:
        - action: rebuild
          path: apps/trackme-gateway/src
        - action: rebuild
          path: apps/trackme-gateway/build.gradle
        - action: rebuild
          path: platform
        - action: rebuild
          path: build.gradle

  # Frontend was extracted into a separate repository. This pulls the last image
  # published to GHCR; update the coordinates once the standalone frontend repo
  # publishes its own image. For local frontend development run `npm start` from
  # that repository instead.
  trackme-frontend:
    image: ghcr.io/akarmanov2022/track-me/frontend:latest
    platform: linux/amd64
    environment:
      - REACT_APP_BACKEND_URI=http://localhost
    env_file:
      - .env
    ports:
      - '3000:3000'
    networks:
      - trackme-net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000" ]
      interval: 30s
      timeout: 10s
      retries: 5

  trackme-nginx:
    image: nginx:alpine
    ports:
      - '80:80'
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      trackme-client-gateway:
        condition: service_healthy
      trackme-frontend:
        condition: service_healthy
    networks:
      - trackme-net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "nginx", "-t" ]
      interval: 30s
      timeout: 10s
      retries: 3
    develop:
      watch:
        - action: sync+restart
          path: docker/nginx/nginx.conf
          target: /etc/nginx/conf.d/default.conf

  trackme-kafka:
    image: bitnamilegacy/kafka:latest
    container_name: trackme-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      - KAFKA_ENABLE_KRAFT=yes
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@trackme-kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://trackme-kafka:9092,PLAINTEXT_HOST://localhost:29092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR=1
      - ALLOW_PLAINTEXT_LISTENER=yes
    volumes:
      - kafka_data:/bitnami/kafka
    networks:
      - trackme-net
    healthcheck:
      test: [ "CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1" ]
      interval: 30s
      timeout: 10s
      retries: 10

  telegram-service:
    build:
      context: .
      dockerfile: services/telegram-service/Dockerfile
    platform: linux/amd64
    restart: always
    depends_on:
      trackme-postgres:
        condition: service_healthy
      trackme-kafka:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - '8084:8084'
    networks:
      - trackme-net
    environment:
      - SPRING_PROFILES_ACTIVE=docker-local
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8084/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
    develop:
      watch:
        - action: rebuild
          path: services/telegram-service/src
        - action: rebuild
          path: libs/commons/src
        - action: rebuild
          path: platform
        - action: rebuild
          path: build.gradle

volumes:
  postgres_data:
  kafka_data:

networks:
  trackme-net:
    driver: bridge
