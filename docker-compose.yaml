services:
  trackme-postgres:
    image: 'postgres:latest'
    env_file:
      - .env
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init_schemas.sql:/docker-entrypoint-initdb.d/init_schemas.sql
    networks:
      - trackme-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U project-place -d project-place" ]
      interval: 30s
      timeout: 10s
      retries: 5

  trackme-redis:
    image: redis:latest
    ports:
      - "6380:6379"
    volumes:
      - ./redisdata:/data
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    command: >
      sh -c '
        mkdir -p /usr/local/etc/redis &&
        echo "bind 0.0.0.0" > /usr/local/etc/redis/redis.conf &&
        echo "requirepass $REDIS_PASSWORD" >> /usr/local/etc/redis/redis.conf &&
        echo "appendonly yes" >> /usr/local/etc/redis/redis.conf &&
        echo "appendfsync everysec" >> /usr/local/etc/redis/redis.conf &&
        echo "user default on nopass ~* +@all" > /usr/local/etc/redis/users.acl &&
        echo "user $REDIS_USER on >$REDIS_USER_PASSWORD ~* +@all" >> /usr/local/etc/redis/users.acl &&
        redis-server /usr/local/etc/redis/redis.conf --aclfile /usr/local/etc/redis/users.acl
      '
    # Оставляем вашу healthcheck-строку (но с правильным синтаксисом CMD-SHELL, иначе переменная не подставится)
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep PONG" ]
      interval: 30s
      timeout: 10s
      retries: 5
    env_file:
      - .env
    restart: unless-stopped
    tty: true
    stdin_open: true
    networks:
      - trackme-net

  trackme-nginx:
    image: nginx:latest
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    networks:
      - trackme-net

  trackme-backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      - SPRING_PROFILES_ACTIVE=development
    platform: linux/amd64
    restart: always
    env_file:
      - .env
    depends_on:
      - trackme-postgres
      - trackme-redis
    ports:
      - '8080:8080'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - trackme-net
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5

  trackme-sso:
    build:
      context: .
      dockerfile: services/trackme-sso/Dockerfile
    platform: linux/amd64
    restart: always
    depends_on:
      - trackme-postgres
      - trackme-redis
    env_file:
      - .env
    ports:
      - '9000:8080'
    networks:
      - trackme-net
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5

  trackme-client-gateway:
    build:
      context: .
      dockerfile: apps/trackme-gateway/Dockerfile
    platform: linux/amd64
    restart: always
    depends_on:
      - trackme-backend
      - trackme-sso
      - trackme-nginx
    env_file:
      - .env
    networks:
      - trackme-net
    ports:
      - '8081:8080'
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5

  trackme-frontend:
    build:
      context: apps/frontend
      dockerfile: Dockerfile
    platform: linux/amd64
    env_file:
      - .env
    ports:
      - '3000:3000'
    networks:
      - trackme-net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000" ]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:

networks:
  trackme-net:
    external: true
