services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=project-place'
      - 'POSTGRES_PASSWORD=project-place'
      - 'POSTGRES_USER=project-place'
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - demo

  backend:
    container_name: track-me-backend
    image: akarmanoff/track-me-backend:latest
    restart: always

    depends_on:
      - postgres
    environment:
      JWT_SECRET: cf83e1357eefb8bdf1542850d66d8007d620e4050b5715dc83f4a921d36ce9ce47d0d13c5d85f2b0ff8318d2877eec2f63b931bd47417a81a538327af927da3e
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/project-place
      SPRING_DATASOURCE_USERNAME: project-place
      SPRING_DATASOURCE_PASSWORD: project-place
    ports:
      - '8080:8080'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - demo

  frontend:
    container_name: track-me-frontend
    image: akarmanoff/track-me-frontend:latest
    restart: always
    ports:
      - '3000:3000'
    networks:
      - demo

volumes:
  postgres_data:

networks:
  demo:
    driver: bridge